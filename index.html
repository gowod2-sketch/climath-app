<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mathuit">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<title>Mathuit · 마수이</title>
<style>
:root{
color-scheme:light;
--s2:#ffffff;--s1:#EEF1FA;--s0:#F4F6FC;
--text:#1B2033;--text2:#5A6480;--muted:#98A0B8;
--border:rgba(27,32,51,.10);--border2:rgba(27,32,51,.18);
--accent:#4C5FD5;--accent2:#7B5CE6;--accent-bg:#E9ECFD;
--aux:#F2653E;--aux-bg:#FDEDE8;
--ok:#12A97A;--ok-bg:#E3F6EF;
--warm:#F6A623;--warm-bg:#FDF2DE;
--shadow:0 6px 20px rgba(27,32,51,.08);
--shadow2:0 14px 40px rgba(27,32,51,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{background:var(--s0);color:var(--text);font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.m{font-family:"Times New Roman",Times,serif;font-style:normal;}
.v{font-family:"Times New Roman",Times,serif;font-style:italic;}
.bar{height:4px;background:var(--accent-bg);flex:0 0 auto;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 3px 3px 0;transition:width .3s cubic-bezier(.2,.8,.25,1);}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:0 0 auto;}
.round{width:32px;height:32px;border-radius:11px;background:var(--s2);color:var(--accent);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
.pill{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:999px;padding:5px 13px;white-space:nowrap;}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stage{position:relative;flex:1 1 auto;min-height:0;background:transparent;overflow:hidden;margin:0 8px 6px;display:flex;flex-direction:column;}
.blurwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;transition:filter .18s ease;}
.blurwrap.on{filter:blur(3px);}
.book{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:transparent;touch-action:pan-y;}
.sheet{position:absolute;inset:4px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s2);border-radius:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;backface-visibility:hidden;}
.pad{padding:14px 22px 30px;max-width:720px;margin:0 auto;}
@media (min-width:760px){.pad{padding:22px 48px 40px;}}
.kicker{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;letter-spacing:.02em;}
.title{font-size:21px;font-weight:700;margin:9px 0 14px;letter-spacing:-.01em;}
@media (min-width:760px){.title{font-size:25px;}}
.body{font-size:15px;line-height:2.1;margin:0;}
@media (min-width:760px){.body{font-size:17px;line-height:2.2;}}
.eqwrap{display:flex;justify-content:center;margin:16px 0;}
.eq{color:#000;font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:9px;font-size:24px;}
.lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1.08;}
.lim small{font-size:12px;font-weight:600;color:#000;}
.term{cursor:pointer;user-select:none;outline:none;transition:color .35s ease,font-variation-settings .35s ease;}
.term.retired{cursor:default;color:var(--text)!important;font-weight:400!important;font-variation-settings:'wght' 400!important;}
.dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 12px;flex:0 0 auto;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:width .2s,background .2s;}
.pdot.on{width:20px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.20);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:5;}
.veil.on{opacity:1;pointer-events:auto;}
.pop{position:absolute;left:0;right:0;bottom:0;z-index:6;width:auto;max-width:none;max-height:76%;overflow-y:auto;background:var(--s2);border:none;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(27,32,51,.20);padding:8px 16px 20px;opacity:0;transform:translateY(101%);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .18s ease;}
.pop.on{opacity:1;transform:translateY(0);}
.popdepth{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;}
.pophandle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:2px auto 10px;}
.badge{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;}
.seg{height:4px;border-radius:2px;background:var(--accent-bg);flex:1;transition:background .25s;}
.cap{font-size:12px;color:var(--text2);line-height:1.6;min-height:36px;margin:8px 0;}
.defbox{background:var(--ok-bg);border-radius:12px;padding:10px 12px;}
.relrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;}
.rellabel{font-size:11px;color:var(--muted);}
.relchip{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;border:none;background:var(--accent-bg);color:var(--accent);cursor:pointer;}
.deflabel{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:3px;}
.deftext{font-size:12px;line-height:1.6;}
.pt{fill:var(--accent);opacity:0;transition:opacity .3s ease;}
.aux{stroke:var(--aux);stroke-width:1.5;stroke-dasharray:5 4;opacity:0;transition:opacity .35s ease;}
.auxlab{fill:var(--aux);font-size:11px;opacity:0;transition:opacity .35s ease;}
.tick{fill:var(--muted);font-size:11px;}
.axis{stroke:var(--border2);stroke-width:1;}
.grid{stroke:var(--border);stroke-width:.5;}
.tapzone.l:active,.tapzone.r:active{background:rgba(76,95,213,.05);}
.toc{position:absolute;inset:0;z-index:40;background:rgba(27,32,51,.35);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;}
.toc.on{opacity:1;pointer-events:auto;}
.tocpanel{width:100%;max-height:86%;overflow-y:auto;background:var(--s2);border-radius:22px 22px 0 0;padding:14px 16px 20px;transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.8,.25,1);}
.toc.on .tocpanel{transform:translateY(0);}
.tochead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.tocsec{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;display:inline-block;margin:12px 0 6px;}
.tocitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .15s;}
.tocitem:hover{background:var(--s1);}
.tocitem.cur{background:var(--accent-bg);}
.tocmark{margin-left:auto;font-size:11px;color:var(--muted);}
.tocmark.done{color:var(--ok);}
.tocno{font-size:11px;color:var(--muted);min-width:44px;}
.toctitle{font-size:14px;font-weight:600;color:var(--text);}
.tocitem.cur .toctitle{color:var(--accent);}
.inkc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;z-index:6;}
body.pen .inkc{pointer-events:auto;}
body.pen .tapzone{pointer-events:none;}
body.pen .term{cursor:default;}
.penbtn{width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;flex:0 0 auto;}
.penbtn.on{background:var(--aux);color:#fff;}
.inkbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:9;display:none;gap:6px;background:var(--s2);border-radius:999px;padding:5px 8px;box-shadow:var(--shadow2);}
body.pen .inkbar{display:flex;}
.inkbar button{font-size:11px;padding:5px 12px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;font-size:11px;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:5px 12px;white-space:nowrap;transition:opacity .4s ease;}
.tapzone{position:absolute;top:0;bottom:0;width:16%;z-index:30;cursor:pointer;}
.tapzone.l{left:0;}
.tapzone.r{right:0;}
.qa{flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:center;padding:0 10px 10px;flex-wrap:wrap;}
.qa button{font-size:11px;padding:5px 11px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
.qa button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.qa span{font-size:11px;color:var(--muted);}
.tipbtn{margin-left:auto;width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto;}
.tipbtn.on{background:var(--accent-bg);color:var(--accent);}
.install{display:none;margin-left:8px;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(76,95,213,.32);}
.install.on{display:inline-flex;}
.guide{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;}
.guide.on{display:flex;}
.guidecard{background:var(--s2);border-radius:16px;padding:18px 18px 14px;max-width:320px;font-size:13px;line-height:1.85;}
.guidecard h3{margin:0 0 8px;font-size:15px;font-weight:600;}
.guidecard ol{margin:0 0 12px;padding-left:18px;}
.guidecard button{width:100%;font-size:13px;padding:8px;border-radius:10px;border:.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
</style>
</head>
<body>
<div class="bar"><i id="bar" style="width:33%"></i></div>
<div class="top"><button class="round" id="tocBtn" aria-label="목차" style="border:none;cursor:pointer;font-size:15px;">&#9776;</button><span class="pill" id="pill">I. 수열의 극한</span><span class="sub" id="sec">01 수열의 극한</span><button class="penbtn" id="penBtn" aria-label="필기" title="터치 필기">&#9998;</button><button class="tipbtn on" id="tipBtn" aria-label="팁 표시 켜기/끄기" title="팁 강조 켜기/끄기">💡</button><button class="install" id="installBtn">&#8681; 앱 설치</button></div>
<div class="stage" id="stage">
  <div class="blurwrap" id="blur">
    <div class="book" id="book">
            <div class="tapzone l" id="tapL" role="button" tabindex="0" aria-label="이전 개념"></div><div class="tapzone r" id="tapR" role="button" tabindex="0" aria-label="다음 개념"></div>
      
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="veil" id="veil"></div>
  <div class="pop" id="pop"></div>
  <div class="guide" id="guide"><div class="guidecard">
    <h3>홈 화면에 앱으로 추가하기</h3>
    <div id="guideBody"></div>
    <button id="guideClose">닫기</button>
  </div></div>
  <div class="toc" id="toc"><div class="tocpanel">
    <div class="tochead"><span style="font-size:15px;font-weight:700">목차</span><button id="tocClose" aria-label="닫기" style="border:none;background:none;font-size:18px;color:var(--text2);cursor:pointer;line-height:1">&times;</button></div>
    <div id="tocBody"></div>
  </div></div>
  <div class="inkbar"><button id="inkUndo">되돌리기</button><button id="inkClear">이 장 지우기</button><button id="inkDone">읽기 모드</button></div>
  <div class="hint" id="hint">좌우로 밀거나 화면 끝을 탭해서 넘기기 &middot; 파란 용어는 꾹 누르기</div>
</div>
<div class="qa">
  <span>넘김</span>
  <button data-ms="260">260</button><button data-ms="380" aria-pressed="true">380</button><button data-ms="520">520</button>
  <button id="resetExpo" style="margin-left:8px">노출 초기화</button>
</div>
<script>
(function(){
var N=12,X0=30,DX=22;
function xs(i){return X0+i*DX;}
function seq(f){var a=[];for(var n=1;n<=N;n++)a.push(f(n));return a;}
function cl(v){return Math.max(12,Math.min(156,v));}
var TIPS={
 sumval:{title:'급수의 합',cat:'팁개념',ic:'S',def:'부분합의 수열 <span class="v">S</span><sub class="v">n</sub>이 수렴할 때 그 극한값',
  pts:seq(function(n){return 160-100*(1-Math.pow(0.5,n));}),lines:[60],lab:{x:288,y:52,a:'end',t:'S'},
  steps:[{show:4,caption:'부분합 S₁, S₂, S₃ … 을 찍어요.'},{show:12,line:1,label:1,caption:'그 극한값 S가 급수의 합이에요.'}]},
 nthzero:{title:'일반항의 극한',cat:'팁개념',ic:'0',def:'급수가 수렴하면 반드시 <span class="v">a</span><sub class="v">n</sub> → <span class="m">0</span>',
  pts:seq(function(n){return 150-90/n;}),lines:[150],lab:{x:288,y:143,a:'end',t:'aₙ → 0'},
  steps:[{show:4,caption:'항 aₙ 을 순서대로 찍어요.'},{show:12,caption:'뒤로 갈수록 항이 점점 작아져요.'},{show:12,line:1,label:1,caption:'수렴하는 급수는 항이 0으로 가요.'}]},
 geoseries:{title:'등비급수',cat:'팁개념',ic:'&#8721;',def:'등비수열의 모든 항을 더한 급수. 합은 <span class="v">a</span><span class="m">/(1&minus;</span><span class="v">r</span><span class="m">)</span>',
  pts:seq(function(n){return 155-95*(1-Math.pow(0.62,n));}),lines:[60],lab:{x:288,y:52,a:'end',t:'a /(1−r)'},
  steps:[{show:3,caption:'첫째항부터 차례로 더해요.'},{show:12,caption:'|r| < 1 이라 더할수록 조금씩만 늘어요.'},{show:12,line:1,label:1,caption:'합이 a /(1−r) 에 수렴해요.'}]},
 firstterm:{title:'첫째항',cat:'팁개념',ic:'a',def:'수열의 맨 처음 항 <span class="v">a</span><sub class="m">1</sub>',
  pts:seq(function(n){return 150-90*Math.pow(0.72,n-1);}),lines:[],lab:{x:60,y:44,a:'start',t:'여기가 첫째항'},
  steps:[{show:1,label:1,caption:'가장 왼쪽 첫 점이 첫째항이에요.'},{show:12,caption:'이후 항은 공비 r 을 곱해 이어져요.'}]},
 linearity:{title:'극한의 기본 성질',cat:'팁개념',ic:'&#177;',def:'수렴하는 두 수열은 합·차·곱·몫의 극한을 따로 계산해도 된다',
  pts:seq(function(n){return 70+70/n;}),lines:[70],lab:{x:288,y:62,a:'end',t:'각각의 극한으로'},
  steps:[{show:6,caption:'두 수열이 각각 수렴한다고 하면'},{show:12,line:1,label:1,caption:'합·차·곱·몫도 각 극한값으로 계산돼요.'}]},
 indeterminate:{title:'부정형',cat:'팁개념',ic:'?',def:'∞/∞, ∞&minus;∞ 처럼 그대로는 값을 알 수 없는 꼴',
  pts:seq(function(n){return 100+40*Math.sin(n*1.1)/n;}),lines:[100],lab:{x:288,y:92,a:'end',t:'변형해야 보임'},
  steps:[{show:5,caption:'분자와 분모가 둘 다 커져요.'},{show:12,caption:'그대로는 값을 판단할 수 없어요.'},{show:12,line:1,label:1,caption:'최고차항으로 나누면 극한이 드러나요.'}]},
 degree:{title:'최고차항',cat:'팁개념',ic:'n',def:'다항식에서 차수가 가장 높은 항. 부정형 계산의 기준',
  pts:seq(function(n){return 150-100*(1-1/(1+0.35*n));}),lines:[50],lab:{x:288,y:42,a:'end',t:'계수의 비'},
  steps:[{show:5,caption:'분자·분모를 최고차항으로 나눠요.'},{show:12,line:1,label:1,caption:'차수가 같으면 계수의 비로 수렴해요.'}]},
 squeeze:{title:'샌드위치 정리',cat:'팁개념',ic:'&#8804;',def:'양쪽에서 조여오는 두 수열이 같은 값에 수렴하면 가운데도 그 값에 수렴',
  pts:seq(function(n){return 90+40/n;}),lines:[90],lab:{x:160,y:44,a:'middle',t:'위아래가 같은 값으로'},
  steps:[{show:4,caption:'가운데 수열을 위아래로 감싸요.'},{show:12,caption:'감싸는 두 수열이 같은 값으로 가면'},{show:12,line:1,label:1,caption:'가운데 수열도 그 값에 수렴해요.'}]},
 converge:{title:'수렴',cat:'팁개념',ic:'&#8594;',def:'<span class="v">n</span>이 한없이 커질 때 <span class="v">a</span><sub class="v">n</sub>이 한 값에 한없이 가까워짐',
  pts:seq(function(n){return 60+80/n;}),lines:[60],lab:{x:288,y:52,a:'end',t:'y = L'},
  steps:[{show:3,caption:'a₁, a₂, a₃ 을 순서대로 찍어요.'},{show:12,caption:'n이 커질수록 점들이 한 값으로 몰려가요.'},{show:12,line:1,caption:'다가가는 값을 점선 y = L 로 표시해요.'},{show:12,line:1,label:1,caption:'aₙ은 L에 한없이 가까워져요.'}]},
 limitvalue:{title:'극한값',cat:'팁개념',ic:'L',def:'수렴하는 수열이 한없이 가까워지는 그 값 <span class="v">L</span>',
  pts:seq(function(n){return 60+80/n;}),lines:[60],lab:{x:288,y:52,a:'end',t:'y = L'},
  steps:[{show:12,caption:'수렴하는 수열의 점을 모두 찍어요.'},{show:12,line:1,label:1,caption:'점들이 다가가는 그 값이 극한값이에요.'}]},
 diverge:{title:'발산',cat:'팁개념',ic:'&#8734;',def:'어떤 값에도 가까워지지 않음 (&#8734;, &minus;&#8734; 포함)',
  pts:seq(function(n){return 152-10.5*n;}),lines:[],lab:{x:284,y:30,a:'end',t:'∞ 로'},
  steps:[{show:3,caption:'처음 몇 항은 평범해 보여요.'},{show:8,caption:'n이 커질수록 값이 계속 커져요.'},{show:12,label:1,caption:'멈추지 않고 커져요 — 양의 무한대로 발산.'}]},
 oscillate:{title:'진동',cat:'팁개념',ic:'~',def:'수렴도 아니고 &#8734;, &minus;&#8734;로도 가지 않는 발산',
  pts:seq(function(n){return n%2===1?136:64;}),lines:[64,136],lab:{x:160,y:104,a:'middle',t:'한 값에 머물지 않음'},

 d.innerHTML='<div class="pad"><div class="kicker">'+p.no+'</div><div class="title">'+p.title+'</div><p class="body">'+p.p1+'</p>'+eqHTML(p)+'<p class="body">'+p.p2+'</p></div>';
 book.appendChild(d);
 sheets.push(d);
 var dot=document.createElement('span');dot.className='pdot'+(i===0?' on':'');dots.appendChild(dot);
});
var SPEED=340,EASE=1;
var idx=0,prog=0,anim=null,drag=null,veilDrag=null;
function W(){return book.clientWidth;}
function apply(){
 for(var i=0;i<sheets.length;i++){
  var s=sheets[i],d=i-prog,ad=Math.abs(d);
  if(ad>1.15){s.style.visibility='hidden';s.style.transform='translate3d('+(d>0?120:-120)+'%,0,0)';continue;}
  s.style.visibility='visible';
  s.style.transform='translate3d(calc('+(d*100).toFixed(3)+'% + '+(d*14).toFixed(1)+'px),0,0)';
  s.style.zIndex=String(20-Math.round(ad*10));
  s.style.boxShadow = ad<0.02 ? 'var(--shadow)' : '0 10px 28px rgba(27,32,51,.14)';
 }
 var d2=dots.querySelectorAll('.pdot');
 for(var j=0;j<d2.length;j++) d2[j].classList.toggle('on', j===Math.round(prog));
 bar.style.width=Math.round((Math.round(prog)+1)/PAGES.length*100)+'%';
 var cur=PAGES[Math.round(prog)];
 if(cur){document.getElementById('pill').textContent=cur.unit||'I. 수열의 극한';document.getElementById('sec').textContent=cur.sec||'';}
}
var settleTimer=null;
function settle(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 prog=to;idx=Math.round(to);apply();
 countExposure(idx);
 if(typeof markTOC==='function')markTOC();
 if(typeof saveLast==='function')saveLast();
 if(done)done();
}
function animateTo(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 if(document.hidden){ settle(to,done); return; }
 var from=prog,t0=performance.now(),dur=Math.max(140,SPEED*Math.min(1,Math.abs(to-from)+.35));
 var finished=false;
 settleTimer=setTimeout(function(){ if(!finished) settle(to,done); }, dur+400);
 (function step(now){
  var k=Math.min(1,(now-t0)/dur);
  var e=1-Math.pow(1-k,3);
  prog=from+(to-from)*e;apply();
  if(k<1)anim=requestAnimationFrame(step);
  else{finished=true;settle(to,done);}
 })(t0);
}
apply();
window.addEventListener('resize',apply);
document.addEventListener('visibilitychange',function(){
 if(document.hidden && (anim||settleTimer)) settle(Math.round(prog));
});
function graphSVG(t){
 var s='<svg viewBox="0 0 300 178" style="width:100%;display:block">';
 [40,88,136].forEach(function(g){s+='<line class="grid" x1="24" y1="'+g+'" x2="292" y2="'+g+'"/>';});
 s+='<line class="axis" x1="24" y1="160" x2="292" y2="160"/><line class="axis" x1="24" y1="10" x2="24" y2="160"/>';
 s+='<text class="tick" x="14" y="14" font-style="italic">a</text><text class="tick" x="288" y="174" text-anchor="end" font-style="italic">n</text>';
 for(var i=0;i<N;i+=2){s+='<text class="tick" x="'+xs(i)+'" y="173" text-anchor="middle">'+(i+1)+'</text>';}
 t.lines.forEach(function(ly){s+='<line class="aux" data-aux x1="26" y1="'+ly+'" x2="292" y2="'+ly+'"/>';});
 s+='<text class="auxlab" data-lab x="'+t.lab.x+'" y="'+t.lab.y+'" text-anchor="'+t.lab.a+'" font-style="italic">'+t.lab.t+'</text>';
 t.pts.forEach(function(cy,i){s+='<circle class="pt" data-i="'+i+'" cx="'+xs(i)+'" cy="'+cl(cy).toFixed(1)+'" r="4"/>';});
 return s+'</svg>';
}
var timer=null,tip=null,step=0;
var STACK=[];
function paint(){
 var t=TIPS[tip],s=t.steps[step];
 pop.querySelectorAll('.pt').forEach(function(c){
  var i=+c.getAttribute('data-i'),on=i<s.show;
  c.style.transitionDelay=(on&&c.style.opacity!=1)?(i*40)+'ms':'0ms';
  c.style.opacity=on?1:0;
 });
 pop.querySelectorAll('[data-aux]').forEach(function(l){l.style.opacity=s.line?1:0;});
 var lab=pop.querySelector('[data-lab]');if(lab)lab.style.opacity=s.label?1:0;
 pop.querySelector('.cap').textContent=s.caption;
 t.steps.forEach(function(_,i){pop.querySelector('[data-seg="'+i+'"]').style.background=i<=step?'var(--accent)':'var(--border)';});
}
var REL={converge:['limitvalue','diverge'],limitvalue:['converge','squeeze'],diverge:['oscillate','converge'],
 oscillate:['diverge','converge'],geoseq:['ratio','firstterm'],ratio:['geoseq','geoseries'],
 series:['partial','sumval'],partial:['series','sumval'],sumval:['partial','nthzero'],
 nthzero:['series','diverge'],geoseries:['geoseq','sumval'],firstterm:['geoseq','ratio'],
 linearity:['converge','limitvalue'],indeterminate:['degree','diverge'],degree:['indeterminate','converge'],
 squeeze:['converge','limitvalue']};
function relHTML(key){
 var r=(REL[key]||[]).filter(function(x){return TIPS[x];});
 if(!r.length) return '';
 return '<div class="relrow"><span class="rellabel">연관</span>'
  + r.map(function(x){return '<button class="relchip" data-rel="'+x+'">'+TIPS[x].title+'</button>';}).join('')
  + '</div>';
}
function openPop(key,el,noPush){
 if(!noPush){ if(STACK[STACK.length-1]!==key) STACK.push(key); }
 tip=key;step=0;
 var t=TIPS[key];
 var segs=t.steps.map(function(_,i){return '<span class="seg" data-seg="'+i+'"></span>';}).join('');
 pop.innerHTML='<div class="pophandle"></div><div style="display:flex;align-items:center;gap:9px;margin-bottom:9px"><span class="badge">'+t.ic+'</span><span><span style="display:block;font-size:11px;color:var(--accent);font-weight:600">'+t.cat+'</span><span style="display:block;font-size:14px;font-weight:600">'+t.title+'</span></span>'
  +(STACK.length>1 ? '<span class="popdepth">'+STACK.length+'단계 · 배경을 탭하면 뒤로</span>' : '<span class="popdepth">배경을 탭하면 닫힘</span>')
  +'</div><div style="display:flex;gap:4px;margin-bottom:8px">'+segs+'</div>'+graphSVG(t)+'<p class="cap"></p><div class="defbox"><div class="deflabel">한 줄 정의</div><div class="deftext">'+t.def+'</div></div>'+relHTML(key);
 pop.querySelectorAll('[data-rel]').forEach(function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();});
  b.addEventListener('pointerup',function(e){e.stopPropagation();});
  b.addEventListener('click',function(e){e.stopPropagation();openPop(b.getAttribute('data-rel'),b);});
 });
 pop.classList.add('on');
 veil.classList.add('on');blur.classList.add('on');
 paint();
 timer=setInterval(function(){
  if(step<TIPS[tip].steps.length-1){step++;paint();}else{clearInterval(timer);timer=null;}
 },1000);
}
function closeAllPops(){
 STACK=[];
 if(timer){clearInterval(timer);timer=null;}
 pop.classList.remove('on');veil.classList.remove('on');blur.classList.remove('on');
}
function popOne(){
 if(STACK.length<=1){ closeAllPops(); return; }
 STACK.pop();
 openPop(STACK[STACK.length-1],null,true);
}
function closePop(){
 if(timer){clearInterval(timer);timer=null;}
 pop.classList.remove('on');veil.classList.remove('on');blur.classList.remove('on');
}

var EXPO_KEY='mathtip_expo_v1';
var EXPO=(function(){try{return JSON.parse(localStorage.getItem(EXPO_KEY))||{};}catch(e){return {};}})();
function saveExpo(){try{localStorage.setItem(EXPO_KEY,JSON.stringify(EXPO));}catch(e){}}
var FADE_END=20, RETIRE=40;
var C_ON=[0x4C,0x5F,0xD5], C_OFF=[0x1B,0x20,0x33];
function expoStyle(n){
 var t=Math.min(1,Math.max(0,(n-1)/(FADE_END-1)));
 var e=Math.pow(t,0.85);
 var r=Math.round(C_ON[0]+(C_OFF[0]-C_ON[0])*e),
     g=Math.round(C_ON[1]+(C_OFF[1]-C_ON[1])*e),
     b=Math.round(C_ON[2]+(C_OFF[2]-C_ON[2])*e);
 return {color:'rgb('+r+','+g+','+b+')', weight:Math.round(700-300*e)};
}
function styleTerms(){
 document.querySelectorAll('.term').forEach(function(el){
  var k=el.getAttribute('data-t'), n=EXPO[k]||0;
  if(n>RETIRE && !(typeof REVIVE!=='undefined' && REVIVE)){ el.classList.add('retired'); return; }
  if(n>RETIRE && typeof REVIVE!=='undefined' && REVIVE){
   el.classList.remove('retired');
   el.style.color='var(--accent)'; el.style.fontWeight=600; el.style.fontVariationSettings="'wght' 600";
   return;
  }
  el.classList.remove('retired');
  var st=expoStyle(Math.max(1,n));
  el.style.color=st.color;
  el.style.fontWeight=st.weight;
  el.style.fontVariationSettings="'wght' "+st.weight;
 });
}
var counted={};
function countExposure(pageIdx){
 if(counted[pageIdx])return;
 counted[pageIdx]=1;
 var sheet=sheets[pageIdx]; if(!sheet)return;
 sheet.querySelectorAll('.term').forEach(function(el){
  var k=el.getAttribute('data-t');
  EXPO[k]=(EXPO[k]||0)+1;
 });
 saveExpo(); styleTerms();
}

function turn(next){
 var t=Math.max(0,Math.min(PAGES.length-1, idx+(next?1:-1)));
 if(t===idx)return;
 animateTo(t);
}
function tapped(){ return window.__lastDrag && Date.now()-window.__lastDrag < 400; }
document.getElementById('tapL').addEventListener('click',function(e){e.stopPropagation();if(tapped())return;hideHint();turn(false);});
document.getElementById('tapR').addEventListener('click',function(e){e.stopPropagation();if(tapped())return;hideHint();turn(true);});
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'){turn(true);} else if(e.key==='ArrowLeft'){turn(false);}
});
veil.addEventListener('pointerdown',function(e){
 e.preventDefault(); e.stopPropagation();
 veilDrag={x:e.clientX,y:e.clientY,t:Date.now()};
});
document.addEventListener('pointermove',function(e){
 if(!veilDrag) return;
 var dx=e.clientX-veilDrag.x, dy=e.clientY-veilDrag.y;
 if(Math.sqrt(dx*dx+dy*dy)>48 && Date.now()-veilDrag.t>220){ veilDrag=null; closeAllPops(); }
});
document.addEventListener('pointerup',function(e){
 if(!veilDrag) return;
 var held=Date.now()-veilDrag.t;
 veilDrag=null;
 if(held>600) closeAllPops(); else popOne();
});
document.addEventListener('pointerdown',function(e){
 if(penOn) return;
 if(e.target===veil) return;
 if(e.target.closest && e.target.closest('.pop')) return;
 var el=e.target.closest?e.target.closest('.term'):null;
 if(el){e.preventDefault();hideHint();if(!el.classList.contains('retired'))openPop(el.getAttribute('data-t'),el);return;}
 if(e.target.closest('.qa')||e.target.closest('.guide'))return;
 if(anim){cancelAnimationFrame(anim);anim=null;}
 drag={x:e.clientX,y:e.clientY,lock:0,base:prog};
},{passive:false});
document.addEventListener('pointermove',function(e){
 if(!drag)return;
 var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.lock){
  if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
  if(Math.abs(dx)<Math.abs(dy)*1.2){drag.lock=2;return;}
  drag.lock=1;drag.x=e.clientX;drag.base=prog;
 }
 if(drag.lock!==1)return;
 e.preventDefault();hideHint();
 var d2=e.clientX-drag.x, w=W();
 var np=drag.base-d2/w;
 if(np<0)np=np*0.32;
 if(np>PAGES.length-1)np=(PAGES.length-1)+(np-(PAGES.length-1))*0.32;
 prog=np;apply();
},{passive:false});
function endDrag(e){

 if(!drag)return;
 var lock=drag.lock;drag=null;
 window.__lastDrag = lock===1 ? Date.now() : 0;
 if(lock!==1)return;
 var t=prog-idx;
 var target=idx;
 if(t>0.22)target=idx+1; else if(t<-0.22)target=idx-1;
 target=Math.max(0,Math.min(PAGES.length-1,target));
 animateTo(target);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
var hintTimer=setTimeout(hideHint,8000);
function hideHint(){clearTimeout(hintTimer);hint.style.opacity=0;}
document.querySelectorAll('.qa button').forEach(function(b){

  b.setAttribute('aria-pressed','true');SPEED=+b.getAttribute('data-ms');

var toc=document.getElementById('toc'),tocBody=document.getElementById('tocBody');
(function buildTOC(){

var LAST_KEY='mathtip_last_v1', REVIVE_KEY='mathtip_revive_v1';
var REVIVE=(function(){try{return localStorage.getItem(REVIVE_KEY)==='1';}catch(e){return false;}})();
function saveLast(){try{localStorage.setItem(LAST_KEY,String(idx));}catch(e){}}

tipBtn.addEventListener('click',function(e){

var INK_KEY='mathtip_ink_v1';
var INK=(function(){try{return JSON.parse(localStorage.getItem(INK_KEY))||{};}catch(e){return {};}})();
function saveInk(){try{localStorage.setItem(INK_KEY,JSON.stringify(INK));}catch(e){}}
var penOn=false, drawing=null;
function inkCanvas(i){ return sheets[i].querySelector('.inkc'); }
function fitCanvas(cv){
 var r=cv.parentNode.getBoundingClientRect(), d=window.devicePixelRatio||1;
 if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
 }
 var g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); return g;
}
function redraw(i){
 var cv=inkCanvas(i); if(!cv) return;
 var g=fitCanvas(cv), r=cv.parentNode.getBoundingClientRect();
 g.clearRect(0,0,r.width,r.height);
 var strokes=INK[i]||[];
 g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#F2653E'; g.lineWidth=2.4;
 strokes.forEach(function(st){
  if(st.length<2) return;
  g.beginPath();
  g.moveTo(st[0][0]*r.width, st[0][1]*r.height);
  for(var k=1;k<st.length;k++) g.lineTo(st[k][0]*r.width, st[k][1]*r.height);
  g.stroke();
 });
}
function redrawAll(){ for(var i=0;i<sheets.length;i++) redraw(i); }
sheets.forEach(function(sh,i){
 var cv=document.createElement('canvas'); cv.className='inkc'; sh.appendChild(cv);
 cv.addEventListener('pointerdown',function(e){
  if(!penOn) return;
  e.preventDefault(); e.stopPropagation();
  cv.setPointerCapture(e.pointerId);
  var r=cv.parentNode.getBoundingClientRect();
  drawing=[[ (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height ]];
 });
 cv.addEventListener('pointermove',function(e){
  if(!penOn||!drawing) return;
  e.preventDefault(); e.stopPropagation();
  var r=cv.parentNode.getBoundingClientRect();
  drawing.push([ (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height ]);
  var g=cv.getContext('2d');
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#F2653E'; g.lineWidth=2.4;
  var n=drawing.length;
  if(n>1){ g.beginPath(); g.moveTo(drawing[n-2][0]*r.width, drawing[n-2][1]*r.height); g.lineTo(drawing[n-1][0]*r.width, drawing[n-1][1]*r.height); g.stroke(); }
 });
 function end(e){
  if(!penOn||!drawing) return;
  e.stopPropagation();
  if(drawing.length>1){ INK[i]=INK[i]||[]; INK[i].push(drawing); saveInk(); }
  drawing=null; redraw(i);
 }
 cv.addEventListener('pointerup',end);
 cv.addEventListener('pointercancel',end);
});
function setPen(on){
 penOn=on;
 document.body.classList.toggle('pen',on);
 document.getElementById('penBtn').classList.toggle('on',on);
 if(on){ closeAllPops(); redrawAll(); }
}
document.getElementById('penBtn').addEventListener('click',function(e){e.stopPropagation();setPen(!penOn);});
document.getElementById('inkDone').addEventListener('click',function(e){e.stopPropagation();setPen(false);});
document.getElementById('inkUndo').addEventListener('click',function(e){

});
document.getElementById('inkClear').addEventListener('click',function(e){
 e.stopPropagation();
 INK[idx]=[]; saveInk(); redraw(idx);
});
window.addEventListener('resize',redrawAll);
redrawAll();

</script>
