<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="200" height="200" fill="#1e3a8a" rx="40"/>

  <!-- 팝업 튀어나오는 말풍선 -->
  <g transform="translate(100, 75)">
    <!-- 말풍선 본체 -->
    <circle cx="0" cy="0" r="50" fill="#60a5fa" stroke="#ffffff" stroke-width="3"/>

    <!-- 팝업 포인터 -->
    <path d="M -30 35 L -15 55 L -45 45 Z" fill="#60a5fa" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- 수학 기호들 -->
  <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">
    <!-- ∑ (Sigma) -->
    <text x="65" y="85" font-size="28" text-anchor="middle" dominant-baseline="middle">Σ</text>

    <!-- = (equals) -->
    <text x="105" y="85" font-size="24" text-anchor="middle" dominant-baseline="middle">=</text>

    <!-- π (Pi) -->
    <text x="145" y="85" font-size="28" text-anchor="middle" dominant-baseline="middle">π</text>
  </g>

  <!-- 앱 이름 (로고 아래) -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MATHUIT</text>
</svg>