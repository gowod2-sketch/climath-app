<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mathuit">
<meta name="theme-color" content="#FFFFFF">

<title>Mathuit · 마수이</title>
<style>
:root{
color-scheme:light;
--s2:#ffffff;--s1:#EEF1FA;--s0:#F4F6FC;
--text:#1B2033;--text2:#5A6480;--muted:#98A0B8;
--border:rgba(27,32,51,.10);--border2:rgba(27,32,51,.18);
--accent:#4C5FD5;--accent2:#7B5CE6;--accent-bg:#E9ECFD;
--aux:#F2653E;--aux-bg:#FDEDE8;
--ok:#12A97A;--ok-bg:#E3F6EF;
--warm:#F6A623;--warm-bg:#FDF2DE;
--shadow:0 6px 20px rgba(27,32,51,.08);
--shadow2:0 14px 40px rgba(27,32,51,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{background:var(--s0);color:var(--text);font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.m{font-family:"Times New Roman",Times,serif;font-style:normal;}
.v{font-family:"Times New Roman",Times,serif;font-style:italic;}
.bar{height:4px;background:var(--accent-bg);flex:0 0 auto;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 3px 3px 0;transition:width .3s cubic-bezier(.2,.8,.25,1);}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:0 0 auto;}
.round{width:32px;height:32px;border-radius:11px;background:var(--s2);color:var(--accent);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
.pill{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:999px;padding:5px 13px;white-space:nowrap;}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stage{position:relative;isolation:isolate;flex:1 1 auto;min-height:0;background:transparent;overflow:hidden;margin:0 8px 6px;display:flex;flex-direction:column;}
.blurwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;transition:filter .18s ease;}
.blurwrap.on{filter:blur(3px);}
.book{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:transparent;touch-action:pan-y;}
.sheet{position:absolute;inset:4px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s2);border-radius:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;backface-visibility:hidden;}
.pad{padding:14px 22px 30px;max-width:720px;margin:0 auto;}
@media (min-width:760px){.pad{padding:22px 48px 40px;}}
.kicker{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;letter-spacing:.02em;}
.title{font-size:21px;font-weight:700;margin:9px 0 14px;letter-spacing:-.01em;}
@media (min-width:760px){.title{font-size:25px;}}
.body{font-size:15px;line-height:2.1;margin:0;}
@media (min-width:760px){.body{font-size:17px;line-height:2.2;}}
.eqwrap{display:flex;justify-content:center;margin:16px 0;}
.eq{color:#000;font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:9px;font-size:24px;}
.lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1.08;}
.lim small{font-size:12px;font-weight:600;color:#000;}
.term{cursor:pointer;user-select:none;outline:none;transition:color .35s ease,font-variation-settings .35s ease;}
.term.retired{cursor:default;color:var(--text)!important;font-weight:400!important;font-variation-settings:'wght' 400!important;}
.dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 12px;flex:0 0 auto;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:width .2s,background .2s;}
.pdot.on{width:20px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.20);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:5;}
.veil.on{opacity:1;pointer-events:auto;}
.pop{position:absolute;left:0;right:0;bottom:0;z-index:20;width:auto;max-width:none;height:var(--ph,64%);min-height:240px;max-height:90%;display:flex;flex-direction:column;overflow:hidden;background:var(--s2);border:none;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(27,32,51,.20);padding:0;opacity:0;transform:translateY(101%);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .18s ease;}
.pop.sizing{transition:opacity .18s ease;}
.pophead{flex:0 0 auto;padding:8px 16px 6px;cursor:ns-resize;touch-action:none;background:var(--s2);border-radius:22px 22px 0 0;}
.popbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px;overscroll-behavior:contain;}
.pop.on{opacity:1;transform:translateY(0);}
.popdepth{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;}
.pophandle{width:44px;height:5px;border-radius:3px;background:var(--border2);margin:2px auto 6px;}
.badge{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;}
.seg{height:4px;border-radius:2px;background:var(--accent-bg);flex:1;transition:background .25s;}
.cap{font-size:12px;color:var(--text2);line-height:1.6;min-height:36px;margin:8px 0;}
.defbox{background:var(--ok-bg);border-radius:12px;padding:10px 12px;}
.relrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;}
.rellabel{font-size:11px;color:var(--muted);}
.relchip{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;border:none;background:var(--accent-bg);color:var(--accent);cursor:pointer;}
.deflabel{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:3px;}
.deftext{font-size:12px;line-height:1.6;}
.pt{fill:var(--accent);opacity:0;transition:opacity .3s ease;}
.aux{stroke:var(--aux);stroke-width:1.5;stroke-dasharray:5 4;opacity:0;transition:opacity .35s ease;}
.auxlab{fill:var(--aux);font-size:11px;opacity:0;transition:opacity .35s ease;}
.tick{fill:var(--muted);font-size:11px;}
.axis{stroke:var(--border2);stroke-width:1;}
.grid{stroke:var(--border);stroke-width:.5;}
.tapzone.l:active,.tapzone.r:active{background:rgba(76,95,213,.05);}
.toc{position:absolute;inset:0;z-index:40;background:rgba(27,32,51,.35);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;}
.toc.on{opacity:1;pointer-events:auto;}
.tocpanel{width:100%;max-height:86%;overflow-y:auto;background:var(--s2);border-radius:22px 22px 0 0;padding:14px 16px 20px;transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.8,.25,1);}
.toc.on .tocpanel{transform:translateY(0);}
.tochead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.tocsec{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;display:inline-block;margin:12px 0 6px;}
.tocitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .15s;}
.tocitem:hover{background:var(--s1);}
.tocitem.cur{background:var(--accent-bg);}
.tocmark{margin-left:auto;font-size:11px;color:var(--muted);}
.tocmark.done{color:var(--ok);}
.tocno{font-size:11px;color:var(--muted);min-width:44px;}
.toctitle{font-size:14px;font-weight:600;color:var(--text);}
.tocitem.cur .toctitle{color:var(--accent);}
.inkc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;z-index:6;}
.zoomwrap{transform-origin:0 0;will-change:transform;}
.sheet.zoomed{overflow:hidden;touch-action:none;}
.zoombadge{position:absolute;right:10px;top:8px;z-index:8;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:3px 10px;opacity:0;transition:opacity .2s;pointer-events:none;}
.zoombadge.on{opacity:1;}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:50;font-size:12px;font-weight:600;color:#fff;background:rgba(27,32,51,.88);border-radius:999px;padding:7px 14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.on{opacity:1;}
body.pen .inkc{pointer-events:auto;}
body.pen .tapzone{pointer-events:none;}
body.pen .term{cursor:default;}
.penbtn{width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;flex:0 0 auto;}
.penbtn.on{background:var(--aux);color:#fff;}
.inkbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;background:var(--s2);border-radius:18px;padding:7px 10px;box-shadow:var(--shadow2);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;}
.swatches{display:flex;gap:5px;align-items:center;}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;flex:0 0 auto;transition:transform .15s,border-color .15s;}
.swatch.on{border-color:var(--text);transform:scale(1.18);}
.inkdiv{width:1px;height:20px;background:var(--border2);flex:0 0 auto;}
.inkbar .tool.on{background:var(--aux);color:#fff;border-color:var(--aux);font-weight:700;}
.inkbar .exit{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
body.erase .inkc{cursor:cell;}
body.pen .inkbar{display:flex;}
.inkbar button.tool,.inkbar button.exit{font-size:11px;padding:6px 12px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;font-size:11px;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:5px 12px;white-space:nowrap;transition:opacity .4s ease;}
.tapzone{position:absolute;top:0;bottom:0;width:16%;z-index:30;cursor:pointer;}
.tapzone.l{left:0;}
.tapzone.r{right:0;}
.qa{flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:center;padding:0 10px 10px;flex-wrap:wrap;}
.qa button{font-size:11px;padding:5px 11px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
.qa button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.qa span{font-size:11px;color:var(--muted);}
.tipbtn{margin-left:auto;width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto;}
.tipbtn.on{background:var(--accent-bg);color:var(--accent);}
.editbtn{width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--accent);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto;}
.editbtn.on{background:var(--accent-bg);color:var(--accent2);}
.install{display:none;margin-left:8px;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(76,95,213,.32);}
.install.on{display:inline-flex;}
.guide{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;}
.guide.on{display:flex;}
.guidecard{background:var(--s2);border-radius:16px;padding:18px 18px 14px;max-width:320px;font-size:13px;line-height:1.85;}
.guidecard h3{margin:0 0 8px;font-size:15px;font-weight:600;}
.guidecard ol{margin:0 0 12px;padding-left:18px;}
.guidecard button{width:100%;font-size:13px;padding:8px;border-radius:10px;border:.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
.miniedit{position:absolute;inset:0;z-index:45;background:rgba(27,32,51,.45);display:none;align-items:flex-end;justify-content:center;padding:16px;}
.miniedit.on{display:flex;}
.minieditpanel{width:min(900px,100%);max-height:90%;overflow:auto;background:var(--s2);border-radius:18px 18px 16px 16px;box-shadow:var(--shadow2);padding:16px;}
.minihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.minihead strong{font-size:16px;}
.minidetail{font-size:12px;color:var(--muted);}
.minigrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:760px){.minigrid{grid-template-columns:1fr;}}
.minirow{display:grid;gap:6px;}
.minirow label{margin:0;font-size:12px;text-transform:none;}
.minirow textarea,.minirow input{width:100%;}
.minitext{min-height:110px;resize:vertical;font-family:"Monaco","Courier New",monospace;font-size:13px;}
.quiz{margin:18px 0 8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.55)}
.quiz h3{margin:0 0 8px;font-size:14px}.quiz p{margin:0 0 10px;font-size:13px}.quizopts{display:grid;gap:7px}.quizopt{position:relative;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:9px 12px;color:var(--text);cursor:pointer;font-size:13px}.quizopt.selected{border-color:#6b4f35;background:#fffaf0}.quizcheck{position:absolute;right:10px;top:50%;width:25px;height:25px;transform:translateY(-50%) scale(.7);opacity:0}.quizopt.selected .quizcheck{opacity:1;transform:translateY(-50%) scale(1)}.quizcheck path{fill:none;stroke:#5b4028;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:32;stroke-dashoffset:32;animation:drawcheck .34s ease-out forwards}@keyframes drawcheck{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="bar"><i id="bar" style="width:33%"></i></div>
<div class="top"><button class="round" id="tocBtn" aria-label="목차" style="border:none;cursor:pointer;font-size:15px;">&#9776;</button><span class="pill" id="pill">I. 수열의 극한</span><span class="sub" id="sec">01 수열의 극한</span><button class="penbtn" id="penBtn" aria-label="필기" title="터치 필기">&#9998;</button><button class="editbtn" id="editBtn" aria-label="편집" title="현재 개념 편집">✎</button><button class="tipbtn on" id="tipBtn" aria-label="팁 표시 켜기/끄기" title="팁 강조 켜기/끄기">💡</button><button class="install" id="installBtn">&#8681; 앱 설치</button></div>
<div class="stage" id="stage">
  <div class="blurwrap" id="blur">
    <div class="book" id="book">
            <div class="tapzone l" id="tapL" role="button" tabindex="0" aria-label="이전 개념"></div><div class="tapzone r" id="tapR" role="button" tabindex="0" aria-label="다음 개념"></div>
      
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="veil" id="veil"></div>
  <div class="guide" id="guide"><div class="guidecard">
    <h3>홈 화면에 앱으로 추가하기</h3>
    <div id="guideBody"></div>
    <button id="guideClose">닫기</button>
  </div></div>
  <div class="miniedit" id="miniedit"><div class="minieditpanel">
    <div class="minihead">
      <div>
        <strong>미니 편집기</strong>
        <div class="minidetail">지금 보고 있는 개념만 바로 수정하고 저장 없이 즉시 반영합니다.</div>
      </div>
      <button id="miniClose" style="border:none;background:none;font-size:20px;color:var(--text2);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="minigrid">
      <div class="minirow"><label>개념 번호</label><input type="text" id="miniNo"></div>
      <div class="minirow"><label>제목</label><input type="text" id="miniTitle"></div>
      <div class="minirow"><label>단원</label><input type="text" id="miniUnit"></div>
      <div class="minirow"><label>소단원</label><input type="text" id="miniSec"></div>
      <div class="minirow"><label>왼쪽 식</label><input type="text" id="miniEqL"></div>
      <div class="minirow"><label>오른쪽 식</label><input type="text" id="miniEqR"></div>
      <div class="minirow"><label>본문 1</label><textarea class="minitext" id="miniP1"></textarea></div>
      <div class="minirow"><label>본문 2</label><textarea class="minitext" id="miniP2"></textarea></div>
    </div>
    <div class="button-group" style="margin-top:14px">
      <button class="btn-primary" id="miniApply">즉시 반영</button>
      <button class="btn-secondary" id="miniExport">현재값 복사</button>
      <button class="btn-secondary" id="miniReset">원본 되돌리기</button>
    </div>
  </div></div>
  <div class="toc" id="toc"><div class="tocpanel">
    <div class="tochead"><span style="font-size:15px;font-weight:700">목차</span><button id="tocClose" aria-label="닫기" style="border:none;background:none;font-size:18px;color:var(--text2);cursor:pointer;line-height:1">&times;</button></div>
    <div id="tocBody"></div>
  </div></div>
  <div class="inkbar"><span class="swatches" id="swatches"><button class="swatch on" data-c="#F2653E" style="--c:#F2653E" aria-label="코랄"></button><button class="swatch" data-c="#4C5FD5" style="--c:#4C5FD5" aria-label="인디고"></button><button class="swatch" data-c="#12A97A" style="--c:#12A97A" aria-label="초록"></button><button class="swatch" data-c="#F6A623" style="--c:#F6A623" aria-label="노랑"></button><button class="swatch" data-c="#1B2033" style="--c:#1B2033" aria-label="검정"></button></span><span class="inkdiv"></span><button class="tool" id="inkErase">지우개</button><button class="tool" id="inkUndo">되돌리기</button><button class="tool" id="inkClear">전체 지우기</button><button class="exit" id="inkDone">완료</button></div>
  <div class="toast" id="toast"></div>
  <div class="hint" id="hint">좌우로 밀어 넘기기 &middot; 파란 용어 탭 &middot; 두 손가락으로 확대 &middot; 길게 눌러 필기</div>
</div>
<div class="qa">
  <span>넘김</span>
  <button data-ms="260">260</button><button data-ms="380" aria-pressed="true">380</button><button data-ms="520">520</button>
  <button id="resetExpo" style="margin-left:8px">노출 초기화</button>
</div>
<script>
(function(){
var N=12,X0=30,DX=22;
function xs(i){return X0+i*DX;}
function seq(f){var a=[];for(var n=1;n<=N;n++)a.push(f(n));return a;}

function apply(){
 for(var i=0;i<sheets.length;i++){
  var s=sheets[i],d=i-prog,ad=Math.abs(d);
  if(ad>1.15){s.style.visibility='hidden';s.style.transform='translate3d('+(d>0?120:-120)+'%,0,0)';continue;}
  s.style.visibility='visible';
  s.style.transform='translate3d(calc('+(d*100).toFixed(3)+'% + '+(d*14).toFixed(1)+'px),0,0)';
  s.style.zIndex=String(20-Math.round(ad*10));
  s.style.boxShadow = ad<0.02 ? 'var(--shadow)' : '0 10px 28px rgba(27,32,51,.14)';
 }
 var d2=dots.querySelectorAll('.pdot');
 for(var j=0;j<d2.length;j++) d2[j].classList.toggle('on', j===Math.round(prog));
 bar.style.width=Math.round((Math.round(prog)+1)/PAGES.length*100)+'%';
 var cur=PAGES[Math.round(prog)];
 if(cur){document.getElementById('pill').textContent=cur.unit||'I. 수열의 극한';document.getElementById('sec').textContent=cur.sec||'';}
}
var settleTimer=null;
function settle(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 prog=to;idx=Math.round(to);apply();
 countExposure(idx);
 if(typeof markTOC==='function')markTOC();
 if(typeof saveLast==='function')saveLast();
 if(done)done();
}
function animateTo(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 if(document.hidden){ settle(to,done); return; }
 var from=prog,t0=performance.now(),dur=Math.max(140,SPEED*Math.min(1,Math.abs(to-from)+.35));
 var finished=false;
 settleTimer=setTimeout(function(){ if(!finished) settle(to,done); }, dur+400);
 (function step(now){
  var k=Math.min(1,(now-t0)/dur);
  var e=1-Math.pow(1-k,3);
  prog=from+(to-from)*e;apply();
  if(k<1)anim=requestAnimationFrame(step);
  else{finished=true;settle(to,done);}
 })(t0);
}
apply();
window.addEventListener('resize',apply);
document.addEventListener('visibilitychange',function(){
 if(document.hidden && (anim||settleTimer)) settle(Math.round(prog));
});

 [40,88,136].forEach(function(g){s+='<line class="grid" x1="24" y1="'+g+'" x2="292" y2="'+g+'"/>';});
 s+='<line class="axis" x1="24" y1="160" x2="292" y2="160"/><line class="axis" x1="24" y1="10" x2="24" y2="160"/>';
 s+='<text class="tick" x="14" y="14" font-style="italic">a</text><text class="tick" x="288" y="174" text-anchor="end" font-style="italic">n</text>';
 for(var i=0;i<N;i+=2){s+='<text class="tick" x="'+xs(i)+'" y="173" text-anchor="middle">'+(i+1)+'</text>';}
 t.lines.forEach(function(ly){s+='<line class="aux" data-aux x1="26" y1="'+ly+'" x2="292" y2="'+ly+'"/>';});

 t.pts.forEach(function(cy,i){s+='<circle class="pt" data-i="'+i+'" cx="'+xs(i)+'" cy="'+cl(cy).toFixed(1)+'" r="4"/>';});

// ---- 팁개념 스택: 여러 개를 동시에 열어 쌓아둡니다 ----
// 배경 1탭 = 맨 위 하나만 닫기 / 배경 슬라이드 = 전부 닫기
var POPS=[];              // [{key, el, timer, step}]
var MAXPOP=5;             // 그 이상은 가장 오래된 것부터 밀어냅니다

function relHTML(key){
 var r=(REL[key]||[]).filter(function(x){return TIPS[x];});

  + r.map(function(x){return '<button class="relchip" data-rel="'+x+'">'+TIPS[x].title+'</button>';}).join('')
  + '</div>';
}

function paintPop(p){
 var t=TIPS[p.key], s=t.steps[p.step], el=p.el;
 el.querySelectorAll('.pt').forEach(function(c){
  var i=+c.getAttribute('data-i'),on=i<s.show;
  c.style.transitionDelay=(on&&c.style.opacity!=1)?(i*40)+'ms':'0ms';
  c.style.opacity=on?1:0;
 });
 el.querySelectorAll('[data-aux]').forEach(function(l){l.style.opacity=s.line?1:0;});
 var lab=el.querySelector('[data-lab]');if(lab)lab.style.opacity=s.label?1:0;
 var cap=el.querySelector('.cap'); if(cap) cap.textContent=s.caption;
 t.steps.forEach(function(_,i){
  var seg=el.querySelector('[data-seg="'+i+'"]');
  if(seg) seg.style.background=i<=p.step?'var(--accent)':'var(--border)';
 });
}

// ---- 팝업 높이: 헤더(핸들)를 위아래로 끌어 조절합니다. 값은 기억해 둡니다. ----
var PH_KEY='mathtip_poph_v1';
var POPH=(function(){
 var v=parseFloat(localStorage.getItem(PH_KEY));
 return (isNaN(v)||v<36||v>90) ? 64 : v;
})();
function applyPopHeight(){
 stage.style.setProperty('--ph', POPH.toFixed(1)+'%');
}
function setPopHeight(v,save){
 POPH=Math.max(36,Math.min(90,v));
 applyPopHeight();
 if(save){ try{ localStorage.setItem(PH_KEY,String(POPH)); }catch(e){} }
}
applyPopHeight();

// 헤더를 끌어 크기 조절. 아래로 많이 내리면 닫힙니다.
function attachResize(el){
 var head=el.querySelector('.pophead'); if(!head) return;
 var st=null;
 head.addEventListener('pointerdown',function(e){
  e.preventDefault(); e.stopPropagation();
  head.setPointerCapture(e.pointerId);
  st={y:e.clientY,h:POPH,moved:false};
  el.classList.add('sizing');
 });
 head.addEventListener('pointermove',function(e){
  if(!st) return;
  e.preventDefault(); e.stopPropagation();
  var dy=e.clientY-st.y;
  if(Math.abs(dy)>4) st.moved=true;
  var stageH=stage.getBoundingClientRect().height||1;
  setPopHeight(st.h - dy/stageH*100, false);
 });
 function done(e){
  if(!st) return;
  e.stopPropagation();
  var dy=e.clientY-st.y, moved=st.moved;
  st=null;
  el.classList.remove('sizing');
  var stageH=stage.getBoundingClientRect().height||1;
  // 아래로 크게 내리면 닫기
  if(dy/stageH*100 > 22){ setPopHeight(64,true); popOne(); return; }
  if(moved) setPopHeight(POPH,true);
 }
 head.addEventListener('pointerup',done);
 head.addEventListener('pointercancel',done);
}

// 스택 안에서의 위치에 따라 뒤 카드가 위로 살짝 보이게 배치합니다.
function layout(){
 var n=POPS.length;
 POPS.forEach(function(p,i){
  var d=n-1-i;                       // 0 = 맨 앞
  p.el.style.zIndex=String(6+i);
  p.el.style.transform='translateY('+(-d*11)+'px) scale('+(1-d*0.028).toFixed(3)+')';
  p.el.style.opacity=d>3?0:1;
  p.el.style.filter=d?'brightness('+(1-d*0.04).toFixed(2)+')':'none';
  var depth=p.el.querySelector('.popdepth');
  if(depth) depth.textContent = n>1
    ? (n+'개 열림 · 위 손잡이를 끌어 크기 조절')
    : '손잡이를 끌어 크기 조절 · 배경 탭 닫기';
 });
 veil.classList.toggle('on', n>0);
 blur.classList.toggle('on', n>0);
}

function openPop(key){
 if(!TIPS[key]) return;
 var existing=POPS.filter(function(p){return p.key===key;})[0];
 if(existing){ // 이미 열려 있으면 맨 앞으로
  POPS.splice(POPS.indexOf(existing),1); POPS.push(existing); layout(); return;
 }
 while(POPS.length>=MAXPOP) removePop(POPS[0]);

 var t=TIPS[key];
 var el=document.createElement('div');
 el.className='pop';
 var segs=t.steps.map(function(_,i){return '<span class="seg" data-seg="'+i+'"></span>';}).join('');
 el.innerHTML='<div class="pophead"><div class="pophandle"></div><div style="display:flex;align-items:center;gap:9px"><span class="badge">'+t.ic+'</span><span><span style="display:block;font-size:11px;color:var(--accent);font-weight:600">'+t.cat+'</span><span style="display:block;font-size:14px;font-weight:600">'+t.title+'</span></span><span class="popdepth"></span></div></div>'
  +'<div class="popbody"><div style="display:flex;gap:4px;margin:8px 0">'+segs+'</div>'+graphSVG(t)+'<p class="cap"></p><div class="defbox"><div class="deflabel">한 줄 정의</div><div class="deftext">'+t.def+'</div></div>'+relHTML(key)+'</div>';
 el.style.transform='translateY(101%)';
 stage.appendChild(el);

 var p={key:key,el:el,timer:null,step:0};
 POPS.push(p);

 el.querySelectorAll('[data-rel]').forEach(function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();});
  b.addEventListener('pointerup',function(e){e.stopPropagation();});
  b.addEventListener('click',function(e){e.stopPropagation();openPop(b.getAttribute('data-rel'));});
 });
 // 팝업 본문 안의 용어도 눌러서 새 팝업을 쌓을 수 있게
 el.querySelectorAll('.term').forEach(function(tm){
  tm.addEventListener('click',function(e){e.stopPropagation();openPop(tm.getAttribute('data-t'));});
 });

 attachResize(el);
 el.offsetHeight;              // reflow: 진입 애니메이션이 보이도록
 el.classList.add('on');
 layout();
 paintPop(p);
 p.timer=setInterval(function(){
  if(p.step<TIPS[p.key].steps.length-1){p.step++;paintPop(p);}
  else{clearInterval(p.timer);p.timer=null;}
 },1000);
}

function removePop(p){
 var i=POPS.indexOf(p); if(i<0) return;
 POPS.splice(i,1);
 if(p.timer){clearInterval(p.timer);p.timer=null;}
 p.el.classList.remove('on');
 p.el.style.transform='translateY(101%)';
 setTimeout(function(){ if(p.el.parentNode) p.el.parentNode.removeChild(p.el); },300);
}

function popOne(){                      // 배경 1탭
 if(!POPS.length) return;
 removePop(POPS[POPS.length-1]);
 layout();
}
function closeAllPops(){                // 배경 슬라이드
 POPS.slice().forEach(removePop);
 POPS=[];
 layout();
}
var closePop=closeAllPops;

var EXPO_KEY='mathtip_expo_v1';
var EXPO=(function(){try{return JSON.parse(localStorage.getItem(EXPO_KEY))||{};}catch(e){return {};}})();
function saveExpo(){try{localStorage.setItem(EXPO_KEY,JSON.stringify(EXPO));}catch(e){}}
var FADE_END=20, RETIRE=40;
var C_ON=[0x4C,0x5F,0xD5], C_OFF=[0x1B,0x20,0x33];
function expoStyle(n){
 var t=Math.min(1,Math.max(0,(n-1)/(FADE_END-1)));
 var e=Math.pow(t,0.85);
 var r=Math.round(C_ON[0]+(C_OFF[0]-C_ON[0])*e),
     g=Math.round(C_ON[1]+(C_OFF[1]-C_ON[1])*e),
     b=Math.round(C_ON[2]+(C_OFF[2]-C_ON[2])*e);
 return {color:'rgb('+r+','+g+','+b+')', weight:Math.round(700-300*e)};
}
function styleTerms(){
 document.querySelectorAll('.term').forEach(function(el){
  var k=el.getAttribute('data-t'), n=EXPO[k]||0;
  if(n>RETIRE && !(typeof REVIVE!=='undefined' && REVIVE)){ el.classList.add('retired'); return; }
  if(n>RETIRE && typeof REVIVE!=='undefined' && REVIVE){
   el.classList.remove('retired');
   el.style.color='var(--accent)'; el.style.fontWeight=600; el.style.fontVariationSettings="'wght' 600";
   return;
  }
  el.classList.remove('retired');
  var st=expoStyle(Math.max(1,n));
  el.style.color=st.color;
  el.style.fontWeight=st.weight;
  el.style.fontVariationSettings="'wght' "+st.weight;
 });
}
var counted={};
function countExposure(pageIdx){
 if(counted[pageIdx])return;
 counted[pageIdx]=1;
 var sheet=sheets[pageIdx]; if(!sheet)return;
 sheet.querySelectorAll('.term').forEach(function(el){
  var k=el.getAttribute('data-t');
  EXPO[k]=(EXPO[k]||0)+1;
 });
 saveExpo(); styleTerms();
}

function turn(next){

// 블러된 배경: 탭하면 맨 위 한 겹만, 밀면(슬라이드) 전부 닫습니다.
veil.addEventListener('pointerdown',function(e){
 e.preventDefault(); e.stopPropagation();
 veilDrag={x:e.clientX,y:e.clientY,t:Date.now(),slid:false};
});
document.addEventListener('pointermove',function(e){
 if(!veilDrag) return;
 var dx=e.clientX-veilDrag.x, dy=e.clientY-veilDrag.y;
 if(Math.sqrt(dx*dx+dy*dy)>44){ veilDrag.slid=true; veilDrag=null; closeAllPops(); }
});
document.addEventListener('pointerup',function(e){
 if(!veilDrag) return;
 var slid=veilDrag.slid;
 veilDrag=null;
 if(!slid) popOne();
});
document.addEventListener('pointerdown',function(e){
 if(penOn) return;
 if(e.target===veil) return;
 if(e.target.closest && e.target.closest('.pop')) return;
 var el=e.target.closest?e.target.closest('.term'):null;
 if(el){e.preventDefault();hideHint();if(!el.classList.contains('retired'))openPop(el.getAttribute('data-t'),el);return;}
 if(e.target.closest('.qa')||e.target.closest('.guide'))return;
 if(anim){cancelAnimationFrame(anim);anim=null;}
 drag={x:e.clientX,y:e.clientY,lock:0,base:prog};
},{passive:false});
document.addEventListener('pointermove',function(e){
 if(!drag)return;
 var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.lock){
  if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
  if(Math.abs(dx)<Math.abs(dy)*1.2){drag.lock=2;return;}
  drag.lock=1;drag.x=e.clientX;drag.base=prog;
 }
 if(drag.lock!==1)return;
 e.preventDefault();hideHint();
 var d2=e.clientX-drag.x, w=W();
 var np=drag.base-d2/w;
 if(np<0)np=np*0.32;
 if(np>PAGES.length-1)np=(PAGES.length-1)+(np-(PAGES.length-1))*0.32;
 prog=np;apply();
},{passive:false});
function endDrag(e){

 if(!drag)return;
 var lock=drag.lock;drag=null;
 window.__lastDrag = lock===1 ? Date.now() : 0;
 if(lock!==1)return;
 var t=prog-idx;
 var target=idx;
 if(t>0.22)target=idx+1; else if(t<-0.22)target=idx-1;
 target=Math.max(0,Math.min(PAGES.length-1,target));
 animateTo(target);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

var penOn=false, drawing=null, eraseOn=false;

// 획 형식: {c:색, w:굵기, p:[[x,y],...]}
// 예전에 저장한 것은 [[x,y],...] 배열이라 읽을 때 변환해 줍니다.
var INK_DEFAULT='#F2653E';
function normStroke(st){
 return Array.isArray(st) ? {c:INK_DEFAULT,w:2.4,p:st} : st;
}
var inkColor=(function(){
 try{ return localStorage.getItem('mathtip_inkcolor_v1')||INK_DEFAULT; }catch(e){ return INK_DEFAULT; }
})();
function setInkColor(c){
 inkColor=c;
 try{ localStorage.setItem('mathtip_inkcolor_v1',c); }catch(e){}
 document.querySelectorAll('.swatch').forEach(function(b){
  b.classList.toggle('on', b.getAttribute('data-c')===c);
 });
 if(eraseOn) setErase(false);
}

function inkCanvas(i){ return sheets[i].querySelector('.inkc'); }
function fitCanvas(cv){
 var r=cv.parentNode.getBoundingClientRect(), d=window.devicePixelRatio||1;
 if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
 }
 var g=null;
 try{ g=cv.getContext('2d'); }catch(e){}
 if(!g) return null;            // 캔버스를 못 쓰는 환경이어도 앱 전체가 멈추지 않도록
 g.setTransform(d,0,0,d,0,0); return g;
}
function strokePath(g,s,w,h){
 if(!s.p||s.p.length<2) return;
 g.strokeStyle=s.c||INK_DEFAULT; g.lineWidth=s.w||2.4;
 g.beginPath();
 g.moveTo(s.p[0][0]*w, s.p[0][1]*h);
 for(var k=1;k<s.p.length;k++) g.lineTo(s.p[k][0]*w, s.p[k][1]*h);
 g.stroke();
}
function redraw(i){
 var cv=inkCanvas(i); if(!cv) return;
 var g=fitCanvas(cv); if(!g) return;
 var r=cv.parentNode.getBoundingClientRect();
 g.clearRect(0,0,r.width,r.height);
 g.lineCap='round'; g.lineJoin='round';
 (INK[i]||[]).forEach(function(st){ strokePath(g,normStroke(st),r.width,r.height); });
}
function redrawAll(){ for(var i=0;i<sheets.length;i++) redraw(i); }

// 지우개: 점에 닿은 획을 통째로 지웁니다 (픽셀이 아니라 획 단위라 되돌리기와 잘 맞습니다)
function eraseAt(i,nx,ny){
 var list=INK[i]; if(!list||!list.length) return false;
 var cv=inkCanvas(i); if(!cv) return false;
 var r=cv.parentNode.getBoundingClientRect();
 var R=14/Math.max(1,r.width);              // 지우개 반경(가로폭 기준 정규화)
 var Ry=14/Math.max(1,r.height);
 var hit=-1;
 for(var s=list.length-1;s>=0 && hit<0;s--){
  var pts=normStroke(list[s]).p||[];
  for(var k=0;k<pts.length;k++){
   var dx=(pts[k][0]-nx)/R, dy=(pts[k][1]-ny)/Ry;
   if(dx*dx+dy*dy<=1){ hit=s; break; }
  }
 }
 if(hit<0) return false;
 list.splice(hit,1); saveInk(); redraw(i);
 return true;
}

sheets.forEach(function(sh,i){
 var cv=document.createElement('canvas'); cv.className='inkc'; sh.appendChild(cv);
 function pt(e){
  var r=cv.parentNode.getBoundingClientRect();
  return [ (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height ];
 }
 cv.addEventListener('pointerdown',function(e){
  if(!penOn) return;
  // 두 번째 손가락은 그리지 않습니다 (두 손가락 = 필기 모드 나가기)
  if(e.isPrimary===false){ if(drawing){ drawing=null; redraw(i); } return; }
  // stopPropagation 하지 않습니다: 문서 레벨에서 손가락 수를 세야
  // 두 손가락으로 필기 모드를 나갈 수 있습니다. (다른 핸들러는 penOn 으로 이미 막혀 있습니다)
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  var p=pt(e);
  if(eraseOn){ drawing='erase'; eraseAt(i,p[0],p[1]); return; }
  drawing={c:inkColor,w:2.4,p:[p]};
 });
 cv.addEventListener('pointermove',function(e){
  if(!penOn||!drawing) return;
  e.preventDefault(); e.stopPropagation();
  var p=pt(e);
  if(drawing==='erase'){ eraseAt(i,p[0],p[1]); return; }
  drawing.p.push(p);
  var g=null; try{ g=cv.getContext('2d'); }catch(err){}
  if(!g) return;
  var r=cv.parentNode.getBoundingClientRect();
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=drawing.c; g.lineWidth=drawing.w;
  var n=drawing.p.length;
  if(n>1){ g.beginPath(); g.moveTo(drawing.p[n-2][0]*r.width, drawing.p[n-2][1]*r.height); g.lineTo(drawing.p[n-1][0]*r.width, drawing.p[n-1][1]*r.height); g.stroke(); }
 });
 function end(e){
  if(!penOn||!drawing) return;
  e.stopPropagation();
  if(drawing!=='erase' && drawing.p.length>1){ INK[i]=INK[i]||[]; INK[i].push(drawing); saveInk(); }
  drawing=null; redraw(i);
 }
 cv.addEventListener('pointerup',end);
 cv.addEventListener('pointercancel',end);
});

function setErase(on){
 eraseOn=on;
 document.body.classList.toggle('erase',on);
 document.getElementById('inkErase').classList.toggle('on',on);
}
function setPen(on){
 penOn=on;
 document.body.classList.toggle('pen',on);
 document.getElementById('penBtn').classList.toggle('on',on);
 if(on){ closeAllPops(); redrawAll(); }
 else setErase(false);
}
document.getElementById('penBtn').addEventListener('click',function(e){e.stopPropagation();setPen(!penOn);});
document.getElementById('inkDone').addEventListener('click',function(e){e.stopPropagation();setPen(false);});
document.getElementById('inkErase').addEventListener('click',function(e){e.stopPropagation();setErase(!eraseOn);});
document.getElementById('inkUndo').addEventListener('click',function(e){
 e.stopPropagation();
 if(INK[idx]&&INK[idx].length){ INK[idx].pop(); saveInk(); redraw(idx); }
});
document.getElementById('inkClear').addEventListener('click',function(e){
 e.stopPropagation();
 INK[idx]=[]; saveInk(); redraw(idx);
});
document.querySelectorAll('.swatch').forEach(function(b){
 b.addEventListener('click',function(e){ e.stopPropagation(); setInkColor(b.getAttribute('data-c')); });
});
// 툴바를 누를 때 뒤쪽으로 이벤트가 새지 않도록
document.querySelector('.inkbar').addEventListener('pointerdown',function(e){ e.stopPropagation(); });
setInkColor(inkColor);

window.addEventListener('resize',redrawAll);
redrawAll();

// ================= 두 손가락 확대/축소 + 길게 눌러 필기 =================
var toastEl=document.getElementById('toast'), toastTimer=null;
function toast(msg){
 if(!toastEl) return;
 toastEl.textContent=msg; toastEl.classList.add('on');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); },1400);
}

// 페이지별 확대 상태
var ZOOM=[];   // {s, x, y}
function zoomState(i){ return ZOOM[i] || (ZOOM[i]={s:1,x:0,y:0}); }
function zoomWrap(i){ return sheets[i] && sheets[i].querySelector('.zoomwrap'); }
var MINS=1, MAXS=3.2;

function applyZoom(i,animate){
 var z=zoomState(i), w=zoomWrap(i); if(!w) return;
 var sh=sheets[i];
 // 확대 상태에서 빈 공간이 보이지 않도록 이동범위를 제한
 var r=sh.getBoundingClientRect();
 var maxX=Math.max(0,(z.s-1)*r.width), maxY=Math.max(0,(z.s-1)*r.height);
 z.x=Math.min(0,Math.max(-maxX,z.x));
 z.y=Math.min(0,Math.max(-maxY,z.y));
 w.style.transition=animate?'transform .22s cubic-bezier(.2,.8,.25,1)':'none';
 w.style.transform='translate('+z.x.toFixed(1)+'px,'+z.y.toFixed(1)+'px) scale('+z.s.toFixed(3)+')';
 sh.classList.toggle('zoomed', z.s>1.01);
 var badge=sh.querySelector('.zoombadge');
 if(badge){ badge.textContent=z.s.toFixed(1)+'×'; badge.classList.toggle('on', z.s>1.01); }
}
function resetZoom(i,animate){
 var z=zoomState(i); z.s=1; z.x=0; z.y=0; applyZoom(i,animate!==false);
}
function isZoomed(i){ return zoomState(i).s>1.01; }

// ---- 포인터 추적 (핀치 판정용) ----
var pts={}, pinch=null, longTimer=null, longStart=null;

function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

document.addEventListener('pointerdown',function(e){
 if(e.target.closest && (e.target.closest('.pop')||e.target.closest('.toc')||e.target.closest('.qa')||e.target.closest('.guide')||e.target.closest('.inkbar')||e.target.closest('.top'))) return;
 // 첫 손가락이면 이전 제스처의 잔여 포인터를 정리합니다.
 // (pointerup을 놓치는 경우가 있어 이게 없으면 제스처가 영구히 어긋납니다)
 if(e.isPrimary!==false) pts={};
 pts[e.pointerId]={x:e.clientX,y:e.clientY};
 var ids=Object.keys(pts);

 if(ids.length===2){
  // 두 손가락 -> 핀치 시작. 페이지 넘김/필기 예약은 취소.
  clearTimeout(longTimer); longTimer=null; longStart=null;
  drag=null;
  // 필기 중이라면 두 손가락으로 빠져나옵니다 (들어올 때가 길게누르기이므로 대칭)
  if(penOn){ pts={}; setPen(false); return; }
  var a=pts[ids[0]], b=pts[ids[1]];
  var z=zoomState(idx);
  pinch={d0:dist(a,b), s0:z.s, m0:mid(a,b), x0:z.x, y0:z.y};
  return;
 }

 if(ids.length===1 && !penOn && POPS.length===0){
  // 길게 누르면 필기 모드 (제스처로 진입)
  longStart={x:e.clientX,y:e.clientY};
  clearTimeout(longTimer);
  longTimer=setTimeout(function(){
   longTimer=null;
   if(!longStart) return;
   drag=null;
   setPen(true);
   toast('필기 모드 · 두 손가락으로 나가기');
   if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
  },620);
 }
},{passive:true});

document.addEventListener('pointermove',function(e){
 if(!(e.pointerId in pts)) return;
 pts[e.pointerId]={x:e.clientX,y:e.clientY};

 if(longStart && longTimer){
  // 조금이라도 움직이면 길게누르기 취소 (넘김/스크롤 의도)
  if(Math.abs(e.clientX-longStart.x)>9||Math.abs(e.clientY-longStart.y)>9){
   clearTimeout(longTimer); longTimer=null; longStart=null;
  }
 }

 if(pinch){
  var ids=Object.keys(pts);
  if(ids.length<2) return;
  e.preventDefault();
  var a=pts[ids[0]], b=pts[ids[1]];
  var z=zoomState(idx);
  var ns=Math.min(MAXS,Math.max(MINS, pinch.s0 * (dist(a,b)/(pinch.d0||1))));
  var m=mid(a,b);
  var sh=sheets[idx], r=sh.getBoundingClientRect();
  // 손가락 중점을 기준으로 확대 + 중점 이동만큼 패닝
  var cx=pinch.m0.x-r.left, cy=pinch.m0.y-r.top;
  var k=ns/(pinch.s0||1);
  z.s=ns;
  z.x=pinch.x0 - cx*(k-1) + (m.x-pinch.m0.x);
  z.y=pinch.y0 - cy*(k-1) + (m.y-pinch.m0.y);
  applyZoom(idx,false);
 }
},{passive:false});

function clearPointer(e){
 delete pts[e.pointerId];
 var n=Object.keys(pts).length;
 if(pinch && n<2){
  pinch=null;
  var z=zoomState(idx);
  if(z.s<1.04) resetZoom(idx,true); else applyZoom(idx,true);
 }
 if(n===0){ clearTimeout(longTimer); longTimer=null; longStart=null; }
}
document.addEventListener('pointerup',clearPointer,{passive:true});
document.addEventListener('pointercancel',clearPointer,{passive:true});

// 확대된 상태에서 한 손가락 = 패닝 (페이지 넘김 대신)
var panStart=null;
document.addEventListener('pointerdown',function(e){
 if(penOn||pinch) return;
 if(!isZoomed(idx)) return;
 if(e.target.closest && (e.target.closest('.pop')||e.target.closest('.top')||e.target.closest('.qa'))) return;
 var z=zoomState(idx);
 panStart={x:e.clientX,y:e.clientY,x0:z.x,y0:z.y};
 drag=null;
},{passive:true});
document.addEventListener('pointermove',function(e){
 if(!panStart||pinch) return;
 e.preventDefault();
 var z=zoomState(idx);
 z.x=panStart.x0+(e.clientX-panStart.x);
 z.y=panStart.y0+(e.clientY-panStart.y);
 applyZoom(idx,false);
},{passive:false});
document.addEventListener('pointerup',function(){ panStart=null; },{passive:true});
document.addEventListener('pointercancel',function(){ panStart=null; },{passive:true});

// 더블탭으로 확대/원복
var lastTap=0;
document.addEventListener('pointerup',function(e){
 if(penOn||pinch||POPS.length) return;
 if(e.target.closest && (e.target.closest('.pop')||e.target.closest('.top')||e.target.closest('.qa')||e.target.closest('.toc')||e.target.closest('.term'))) return;
 var now=Date.now();
 if(now-lastTap<300){
  lastTap=0;
  var z=zoomState(idx);
  if(isZoomed(idx)) resetZoom(idx,true);
  else{
   var sh=sheets[idx], r=sh.getBoundingClientRect();
   var cx=e.clientX-r.left, cy=e.clientY-r.top;
   z.s=2.2; z.x=-cx*(z.s-1); z.y=-cy*(z.s-1);
   applyZoom(idx,true);
  }
 } else lastTap=now;
},{passive:true});

// 페이지를 넘기면 그 페이지의 확대는 원복
var _animateTo=animateTo;
animateTo=function(to,done){
 if(isZoomed(idx)) resetZoom(idx,false);
 return _animateTo(to,done);
};

// 확대 중에는 좌우 스와이프로 페이지가 넘어가지 않도록
var _turn=turn;
turn=function(next){
 if(isZoomed(idx)){ resetZoom(idx,true); return; }
 return _turn(next);
};

// 필기 모드를 나가면 안내
var _setPen=setPen;
setPen=function(on){
 var was=penOn;
 _setPen(on);
 if(!on && was) toast('읽기 모드로 돌아왔습니다');
};

if(!standalone){installBtn.classList.add('on');}
installBtn.addEventListener('click',function(){

 var html;

  html='<p style="margin:0 0 8px">아이폰·아이패드의 크롬에서는 홈 화면 설치가 지원되지 않습니다. <b>사파리</b>로 이 주소를 열어주세요.</p><ol><li>사파리로 이 페이지 열기</li><li>하단 <b>공유</b> 버튼 탭</li><li><b>홈 화면에 추가</b> 선택</li></ol>';
 }else if(isIOS){
  html='<ol><li>하단 <b>공유</b> 버튼 탭</li><li>목록에서 <b>홈 화면에 추가</b> 선택</li><li>오른쪽 위 <b>추가</b> 탭</li></ol>';
 }else{
  html='<ol><li>브라우저 우측 상단 <b>&#8942;</b> 메뉴 열기</li><li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b> 선택</li></ol><p style="margin:8px 0 0;color:var(--text2)">메뉴에 항목이 없으면 페이지를 한 번 새로고침한 뒤 다시 시도해 주세요.</p>';
 }
 guideBody.innerHTML=html;guide.classList.add('on');
});
document.getElementById('guideClose').addEventListener('click',function(e){e.stopPropagation();guide.classList.remove('on');});
guide.addEventListener('pointerdown',function(e){e.stopPropagation();});

 var last=loadLast();
 if(last>0){ idx=last; prog=last; apply(); countExposure(idx); markTOC(); }
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}
