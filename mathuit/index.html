<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mathuit">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./logo.svg">
<title>Mathuit · 마수이</title>
<style>
:root{
color-scheme:light;
--s2:#ffffff;--s1:#EEF1FA;--s0:#F4F6FC;
--text:#1B2033;--text2:#5A6480;--muted:#98A0B8;
--border:rgba(27,32,51,.10);--border2:rgba(27,32,51,.18);
--accent:#4C5FD5;--accent2:#7B5CE6;--accent-bg:#E9ECFD;
--aux:#F2653E;--aux-bg:#FDEDE8;
--ok:#12A97A;--ok-bg:#E3F6EF;
--warm:#F6A623;--warm-bg:#FDF2DE;
--shadow:0 6px 20px rgba(27,32,51,.08);
--shadow2:0 14px 40px rgba(27,32,51,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{background:var(--s0);color:var(--text);font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.m{font-family:"Times New Roman",Times,serif;font-style:normal;}
.v{font-family:"Times New Roman",Times,serif;font-style:italic;}
.bar{height:4px;background:var(--accent-bg);flex:0 0 auto;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 3px 3px 0;transition:width .3s cubic-bezier(.2,.8,.25,1);}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:0 0 auto;}
.round{width:32px;height:32px;border-radius:11px;background:var(--s2);color:var(--accent);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
.pill{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:999px;padding:5px 13px;white-space:nowrap;}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stage{position:relative;isolation:isolate;flex:1 1 auto;min-height:0;background:transparent;overflow:hidden;margin:0 8px 6px;display:flex;flex-direction:column;}
.blurwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;transition:filter .18s ease;}
.blurwrap.on{filter:blur(3px);}
.book{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:transparent;touch-action:pan-y;}
.sheet{position:absolute;inset:4px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s2);border-radius:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;backface-visibility:hidden;}
.pad{padding:14px 22px 30px;max-width:720px;margin:0 auto;}
@media (min-width:760px){.pad{padding:22px 48px 40px;}}
.kicker{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;letter-spacing:.02em;}
.title{font-size:21px;font-weight:700;margin:9px 0 14px;letter-spacing:-.01em;}
@media (min-width:760px){.title{font-size:25px;}}
.body{font-size:15px;line-height:2.1;margin:0;}
@media (min-width:760px){.body{font-size:17px;line-height:2.2;}}
.eqwrap{display:flex;justify-content:center;margin:16px 0;}
.eq{color:#000;font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:9px;font-size:24px;}
.lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1.08;}
.lim small{font-size:12px;font-weight:600;color:#000;}
.term{cursor:pointer;user-select:none;outline:none;transition:color .35s ease,font-variation-settings .35s ease;}
.term.retired{cursor:default;color:var(--text)!important;font-weight:400!important;font-variation-settings:'wght' 400!important;}
.dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 12px;flex:0 0 auto;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:width .2s,background .2s;}
.pdot.on{width:20px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.20);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:5;}
.veil.on{opacity:1;pointer-events:auto;}
.pop{position:absolute;left:0;right:0;bottom:0;z-index:20;width:auto;max-width:none;height:var(--ph,64%);min-height:240px;max-height:90%;display:flex;flex-direction:column;overflow:hidden;background:var(--s2);border:none;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(27,32,51,.20);padding:0;opacity:0;transform:translateY(101%);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .18s ease;}
.pop.sizing{transition:opacity .18s ease;}
.pophead{flex:0 0 auto;padding:8px 16px 6px;cursor:ns-resize;touch-action:none;background:var(--s2);border-radius:22px 22px 0 0;}
.popbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px;overscroll-behavior:contain;}
.pop.on{opacity:1;transform:translateY(0);}
.popdepth{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;}
.pophandle{width:44px;height:5px;border-radius:3px;background:var(--border2);margin:2px auto 6px;}
.badge{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;}
.seg{height:4px;border-radius:2px;background:var(--accent-bg);flex:1;transition:background .25s;}
.cap{font-size:12px;color:var(--text2);line-height:1.6;min-height:36px;margin:8px 0;}
.defbox{background:var(--ok-bg);border-radius:12px;padding:10px 12px;}
.relrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;}
.rellabel{font-size:11px;color:var(--muted);}
.relchip{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;border:none;background:var(--accent-bg);color:var(--accent);cursor:pointer;}
.deflabel{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:3px;}
.deftext{font-size:12px;line-height:1.6;}
.pt{fill:var(--accent);opacity:0;transition:opacity .3s ease;}
.aux{stroke:var(--aux);stroke-width:1.5;stroke-dasharray:5 4;opacity:0;transition:opacity .35s ease;}
.auxlab{fill:var(--aux);font-size:11px;opacity:0;transition:opacity .35s ease;}
.tick{fill:var(--muted);font-size:11px;}
.axis{stroke:var(--border2);stroke-width:1;}
.grid{stroke:var(--border);stroke-width:.5;}
.tapzone.l:active,.tapzone.r:active{background:rgba(76,95,213,.05);}
.toc{position:absolute;inset:0;z-index:40;background:rgba(27,32,51,.35);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;}
.toc.on{opacity:1;pointer-events:auto;}
.tocpanel{width:100%;max-height:86%;overflow-y:auto;background:var(--s2);border-radius:22px 22px 0 0;padding:14px 16px 20px;transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.8,.25,1);}
.toc.on .tocpanel{transform:translateY(0);}
.tochead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.tocsec{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:7px;padding:3px 9px;display:inline-block;margin:12px 0 6px;}
.tocunit{font-size:13px;font-weight:800;color:var(--text);margin:20px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.tocunit:first-child{margin-top:4px;}
.tocitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .15s;}
.tocitem:hover{background:var(--s1);}
.tocitem.cur{background:var(--accent-bg);}
.tocmark{margin-left:auto;font-size:11px;color:var(--muted);}
.tocmark.done{color:var(--ok);}
.tocno{font-size:11px;color:var(--muted);min-width:44px;}
.toctitle{font-size:14px;font-weight:600;color:var(--text);}
.tocitem.cur .toctitle{color:var(--accent);}
.inkc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;z-index:6;}
.zoomwrap{transform-origin:0 0;will-change:transform;}
.sheet.zoomed{overflow:hidden;touch-action:none;}
.zoombadge{position:absolute;right:10px;top:8px;z-index:8;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:3px 10px;opacity:0;transition:opacity .2s;pointer-events:none;}
.zoombadge.on{opacity:1;}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:50;font-size:12px;font-weight:600;color:#fff;background:rgba(27,32,51,.88);border-radius:999px;padding:7px 14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.on{opacity:1;}
body.pen .inkc{pointer-events:auto;}
body.pen .tapzone{pointer-events:none;}
body.pen .term{cursor:default;}
.penbtn{width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;flex:0 0 auto;}
.penbtn.on{background:var(--aux);color:#fff;}
.inkbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;background:var(--s2);border-radius:18px;padding:7px 10px;box-shadow:var(--shadow2);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;}
.swatches{display:flex;gap:5px;align-items:center;}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;flex:0 0 auto;transition:transform .15s,border-color .15s;}
.swatch.on{border-color:var(--text);transform:scale(1.18);}
.inkdiv{width:1px;height:20px;background:var(--border2);flex:0 0 auto;}
.inkbar .tool.on{background:var(--aux);color:#fff;border-color:var(--aux);font-weight:700;}
.inkbar .exit{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
body.erase .inkc{cursor:cell;}
body.pen .inkbar{display:flex;}
.inkbar button.tool,.inkbar button.exit{font-size:11px;padding:6px 12px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;font-size:11px;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:5px 12px;white-space:nowrap;transition:opacity .4s ease;}
.tapzone{position:absolute;top:0;bottom:0;width:16%;z-index:30;cursor:pointer;}
.tapzone.l{left:0;}
.tapzone.r{right:0;}
.qa{flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:center;padding:0 10px 10px;flex-wrap:wrap;}
.qa button{font-size:11px;padding:5px 11px;border-radius:999px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;}
.qa button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.qa span{font-size:11px;color:var(--muted);}
.tipbtn{margin-left:auto;width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto;}
.tipbtn.on{background:var(--accent-bg);color:var(--accent);}
.editbtn{width:32px;height:32px;border-radius:11px;border:none;background:var(--s2);color:var(--accent);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto;}
.editbtn.on{background:var(--accent-bg);color:var(--accent2);}
.install{display:none;margin-left:8px;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(76,95,213,.32);}
.install.on{display:inline-flex;}
.guide{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;}
.guide.on{display:flex;}
.guidecard{background:var(--s2);border-radius:16px;padding:18px 18px 14px;max-width:320px;font-size:13px;line-height:1.85;}
.guidecard h3{margin:0 0 8px;font-size:15px;font-weight:600;}
.guidecard ol{margin:0 0 12px;padding-left:18px;}
.guidecard button{width:100%;font-size:13px;padding:8px;border-radius:10px;border:.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
.miniedit{position:absolute;inset:0;z-index:45;background:rgba(27,32,51,.45);display:none;align-items:flex-end;justify-content:center;padding:16px;}
.miniedit.on{display:flex;}
.minieditpanel{width:min(900px,100%);max-height:90%;overflow:auto;background:var(--s2);border-radius:18px 18px 16px 16px;box-shadow:var(--shadow2);padding:16px;}
.minihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.minihead strong{font-size:16px;}
.minidetail{font-size:12px;color:var(--muted);}
.minigrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:760px){.minigrid{grid-template-columns:1fr;}}
.minirow{display:grid;gap:6px;}
.minirow label{margin:0;font-size:12px;text-transform:none;}
.minirow textarea,.minirow input{width:100%;}
.minitext{min-height:110px;resize:vertical;font-family:"Monaco","Courier New",monospace;font-size:13px;}
.quiz{margin:0;padding:22px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55)}.quiz h3{margin:0 0 12px;font-size:18px}.quiz p{margin:0 0 18px;font-size:15px;line-height:1.7}.quizopts{display:grid;gap:12px}.quizopt{position:relative;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px 10px 42px;color:var(--text);cursor:pointer;font-size:15px}.quizopt:hover{background:rgba(255,255,255,.5)}.quiznum{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:22px}.quizcheck{position:absolute;left:4px;top:50%;width:34px;height:34px;transform:translateY(-50%) scale(.7);opacity:0}.quizopt.selected .quizcheck{opacity:1;transform:translateY(-50%) scale(1)}.quizcheck path{fill:none;stroke:#4d3828;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:28;stroke-dashoffset:28;animation:drawcheck .34s ease-out forwards}.quizcheck .rough{stroke:#98704b;stroke-width:1.1;stroke-dasharray:25;animation-delay:.04s;opacity:.7}@keyframes drawcheck{to{stroke-dashoffset:0}}</style>
<style>.quiz{position:relative!important;z-index:35!important;touch-action:manipulation!important}.quizopt{position:relative;z-index:36;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.quizopt.selected .quizcheck{opacity:1;transform:translateY(-50%) scale(1)}.quizopt.selected .quizcheck path{animation:none!important;stroke-dasharray:none!important;stroke-dashoffset:0!important}</style>
<style>.update-pop{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;width:min(420px,calc(100% - 28px));padding:15px 16px;border-radius:16px;background:#20263b;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.28);display:none;align-items:center;gap:12px;font-size:13px}.update-pop.on{display:flex}.update-pop span{flex:1}.update-pop button{border:0;border-radius:9px;padding:8px 11px;background:#7c83ff;color:#fff;font-weight:700;cursor:pointer}</style>
<style>.problem-fields{display:none}.miniedit.problem-mode .concept-fields{display:none}.miniedit.problem-mode .problem-fields{display:grid}.problem-fields textarea{min-height:86px}.choice-grid{display:grid;gap:8px}.choice-line{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px}.choice-line b{font-size:20px;text-align:center}.eqpad{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.eqpad button{border:1px solid var(--line);background:var(--s1);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}</style>
</head>
<body>
<div class="update-pop" id="updatePop"><span>새 버전이 배포되었습니다.<br>지금 업데이트할까요?</span><button id="updateNow">업데이트</button><button id="updateLater" style="background:#4a516d">나중에</button></div>
<div class="bar"><i id="bar" style="width:33%"></i></div>
<div class="top"><button class="round" id="tocBtn" aria-label="목차" style="border:none;cursor:pointer;font-size:15px;">&#9776;</button><span class="pill" id="pill">I. 수열의 극한</span><span class="sub" id="sec">01 수열의 극한</span><button class="penbtn" id="penBtn" aria-label="필기" title="터치 필기">&#9998;</button><button class="editbtn" id="editBtn" aria-label="편집" title="현재 개념 편집">✎</button><button class="tipbtn on" id="tipBtn" aria-label="팁 표시 켜기/끄기" title="팁 강조 켜기/끄기">💡</button><button class="install" id="installBtn">&#8681; 앱 설치</button></div>
<div class="stage" id="stage">
  <div class="blurwrap" id="blur">
    <div class="book" id="book">
            <div class="tapzone l" id="tapL" role="button" tabindex="0" aria-label="이전 개념"></div><div class="tapzone r" id="tapR" role="button" tabindex="0" aria-label="다음 개념"></div>
      
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="veil" id="veil"></div>
  <div class="guide" id="guide"><div class="guidecard">
    <h3>홈 화면에 앱으로 추가하기</h3>
    <div id="guideBody"></div>
    <button id="guideClose">닫기</button>
  </div></div>
  <div class="miniedit" id="miniedit"><div class="minieditpanel">
    <div class="minihead">
      <div>
        <strong>미니 편집기</strong>
        <div class="minidetail">지금 보고 있는 개념만 바로 수정하고 저장 없이 즉시 반영합니다.</div>
      </div>
      <button id="miniClose" style="border:none;background:none;font-size:20px;color:var(--text2);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="minigrid concept-fields">
      <div class="minirow"><label>개념 번호</label><input type="text" id="miniNo"></div>
      <div class="minirow"><label>제목</label><input type="text" id="miniTitle"></div>
      <div class="minirow"><label>단원</label><input type="text" id="miniUnit"></div>
      <div class="minirow"><label>소단원</label><input type="text" id="miniSec"></div>
      <div class="minirow"><label>왼쪽 식</label><input type="text" id="miniEqL"></div>
      <div class="minirow"><label>오른쪽 식</label><input type="text" id="miniEqR"></div>
      <div class="minirow"><label>본문 1</label><textarea class="minitext" id="miniP1"></textarea></div>
      <div class="minirow"><label>본문 2</label><textarea class="minitext" id="miniP2"></textarea></div>
    </div>
    <div class="problem-fields">
      <div class="minirow"><label>문제 내용</label><textarea class="minitext" id="miniQuestion" placeholder="학생이 풀 문제를 입력하세요."></textarea></div>
      <div class="minirow"><label>문제 수식</label><input type="text" id="miniProblemEq" placeholder="버튼으로 수식을 조립하세요."><div class="eqpad" data-target="miniProblemEq"><button type="button" data-insert="frac">분수</button><button type="button" data-insert="sup">위첨자</button><button type="button" data-insert="sub">아래첨자</button><button type="button" data-insert="sqrt">√</button><button type="button" data-insert="→">→</button><button type="button" data-insert="∞">∞</button></div></div>
      <div class="minirow"><label>보기 1~5</label><div class="choice-grid"><div class="choice-line"><b>①</b><input id="miniChoice1"></div><div class="choice-line"><b>②</b><input id="miniChoice2"></div><div class="choice-line"><b>③</b><input id="miniChoice3"></div><div class="choice-line"><b>④</b><input id="miniChoice4"></div><div class="choice-line"><b>⑤</b><input id="miniChoice5"></div></div></div>
      <div class="minirow"><label>정답 보기</label><select id="miniAnswer"><option value="1">①</option><option value="2">②</option><option value="3">③</option><option value="4">④</option><option value="5">⑤</option></select></div>
    </div>
    <div class="button-group" style="margin-top:14px">
      <button class="btn-primary" id="miniApply">즉시 반영</button>
      <button class="btn-secondary" id="miniExport">현재값 복사</button>
      <button class="btn-secondary" id="miniReset">원본 되돌리기</button>
    </div>

ss=\"v\">a<\/span><sub><span class=\"v\">n<\/span><\/sub>"},{"id":"c04","order":7,"no":"개념 04","unit":"I. 수열의 극한","sec":"02 급수","title":"급수의 수렴과 발산","pre":[],"p1":"급수의 <span class=\"term\" data-t=\"partial\">부분합<\/span>으로 이루어진 수열 {<span class=\"v\">S<\/span><sub><span class=\"v\">n<\/span><\/sub>}이 일정한 값 <span class=\"v\">S<\/span>에 <span class=\"term\" data-t=\"converge\">수렴<\/span>할 때, 이 급수는 <span class=\"v\">S<\/span>에 수렴한다고 하고 <span class=\"v\">S<\/span>를 <span class=\"term\" data-t=\"sumval\">급수의 합<\/span>이라 한다.","p2":"부분합의 수열이 <span class=\"term\" data-t=\"diverge\">발산<\/span>하면 그 급수도 발산한다. 즉 급수의 수렴과 발산은 부분합 수열의 극한을 조사해 판정한다.","eqL":"n&#8594;&#8734;","eqR":"<span class=\"v\">S<\/span><sub><span class=\"v\">n<\/span><\/sub> <span class=\"m\">=<\/span> <span class=\"v\">S<\/span>"},{"id":"c05","order":8,"no":"개념 05","unit":"I. 수열의 극한","sec":"02 급수","title":"급수의 수렴 판정","pre":[],"p1":"급수가 <span class=\"term\" data-t=\"converge\">수렴<\/span>하면 그 <span class=\"term\" data-t=\"nthzero\">일반항<\/span>은 반드시 0에 가까워진다.","p2":"그러나 역은 성립하지 않는다. 대우를 이용하면 일반항의 극한이 0이 아닐 때 그 급수는 <span class=\"term\" data-t=\"diverge\">발산<\/span>한다 — 발산 판정에 쓰인다.","eqL":"n&#8594;&#8734;","eqR":"<span class=\"v\">a<\/span><sub><span class=\"v\">n<\/span><\/sub> <span class=\"m\">=<\/span> <span class=\"m\">0<\/span>"},{"id":"c06","order":9,"no":"개념 06","unit":"I. 수열의 극한","sec":"02 급수","title":"등비급수의 수렴과 발산","pre":[],"p1":"<span class=\"term\" data-t=\"firstterm\">첫째항<\/span>이 <span class=\"v\">a<\/span>, <span class=\"term\" data-t=\"ratio\">공비<\/span>가 <span class=\"v\">r<\/span>인 <span class=\"term\" data-t=\"geoseq\">등비수열<\/span>에서 얻은 급수를 <span class=\"term\" data-t=\"geoseries\">등비급수<\/span>라 한다.","p2":"<span class=\"v\">a<\/span> &#8800; 0일 때 |<span class=\"v\">r<\/span>| = 1이면 <span class=\"term\" data-t=\"diverge\">발산<\/span>한다.","eqL":"","eqR":"<span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">a<\/span><span class=\"v\">r<\/span> <span class=\"m\">+<\/span> <span class=\"v\">a<\/span><span class=\"v\">r<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">&#8943;<\/span> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span> <span class=\"m\">/<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span> - <span class=\"v\">r<\/span><span class=\"m\">)<\/span>"},{"id":"c07","order":10,"no":"개념 07","unit":"I. 수열의 극한","sec":"02 급수","title":"급수의 성질","pre":[],"p1":"두 급수가 각각 <span class=\"v\">S<\/span>, <span class=\"v\">T<\/span>에 <span class=\"term\" data-t=\"converge\">수렴<\/span>할 때, 두 급수의 합과 차, 그리고 상수배로 만든 급수도 수렴한다.","p2":"또 상수 <span class=\"v\">c<\/span>에 대하여 &#8721; <span class=\"v\">c<\/span> <span class=\"v\">a<\/span><sub><span class=\"v\">n<\/span><\/sub> = <span class=\"v\">c<\/span>S 이다. 단, 이 성질은 각 급수가 <span class=\"term\" data-t=\"converge\">수렴<\/span>할 때에만 쓸 수 있다.","eqL":"","eqR":"<span class=\"m\">&#8721;<\/span> <span class=\"m\">(<\/span><span class=\"v\">a<\/span><sub><span class=\"v\">n<\/span><\/sub> <span class=\"m\">&#177;<\/span> <span class=\"v\">b<\/span><sub><span class=\"v\">n<\/span><\/sub><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">S<\/span> <span class=\"m\">&#177;<\/span> <span class=\"v\">T<\/span>"},{"id":"c11","order":11,"no":"개념 11","unit":"I. 수열의 극한","sec":"02 급수","title":"부분분수를 이용한 급수의 합","pre":[],"p1":"일반항이 분수 꼴인 급수는 <span class=\"term\" data-t=\"partfrac\">부분분수<\/span>로 쪼개면 이웃한 항끼리 서로 사라지는데, 이를 <span class=\"term\" data-t=\"telescoping\">텔레스코핑<\/span>이라 한다.","p2":"부분분수로 쪼갠 뒤 부분합 <span class=\"v\">S<\/span><sub><span class=\"v\">n<\/span><\/sub>을 구하면 앞뒤 항이 사라지고 처음과 끝 항만 남아, <span class=\"v\">n<\/span>&#8594;&#8734; 극한을 취해 급수의 합을 구할 수 있다.","eqL":"n&#8594;&#8734;","eqR":"<span class=\"v\">S<\/span><sub><span class=\"v\">n<\/span><\/sub> <span class=\"m\">=<\/span> <span class=\"m\">1<\/span>"},{"id":"c12","order":12,"no":"개념 12","unit":"II. 지수함수와 로그함수의 미분","sec":"01 지수함수의 극한과 미분","title":"지수함수의 극한","pre":[],"p1":"<span class=\"term\" data-t=\"base\">밑<\/span> <span class=\"v\">a<\/span>가 1보다 큰 <span class=\"term\" data-t=\"expfunc\">지수함수<\/span> <span class=\"v\">y<\/span> = <span class=\"v\">a<\/span>^<span class=\"v\">x<\/span> 에서, <span class=\"v\">a<\/span> > 1이면 <span class=\"v\">x<\/span>가 한없이 커질수록 <span class=\"v\">y<\/span>도 한없이 커진다.","p2":"이때 그래프는 <span class=\"v\">x<\/span>가 한없이 작아질수록 0에 가까워지며, <span class=\"v\">y<\/span> = 0을 <span class=\"term\" data-t=\"asymptote\">점근선<\/span>으로 갖는다. 반대로 0 < <span class=\"v\">a<\/span> < 1이면 <span class=\"v\">x<\/span>가 커질수록 0으로 <span class=\"term\" data-t=\"converge\">수렴<\/span>하고, <span class=\"v\">x<\/span>가 작아질수록 값이 한없이 커진다.","eqL":"x&#8594;&minus;&#8734;","eqR":"<span class=\"v\">a<\/span><sup><span class=\"v\">x<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"m\">0<\/span>"},{"id":"c13","order":13,"no":"개념 13","unit":"II. 지수함수와 로그함수의 미분","sec":"01 지수함수의 극한과 미분","title":"자연상수 e","pre":[],"p1":"(1 + 1/<span class=\"v\">n<\/span>)^<span class=\"v\">n<\/span> 은 <span class=\"v\">n<\/span>이 한없이 커질수록 한 값에 <span class=\"term\" data-t=\"converge\">수렴<\/span>하는데, 그 <span class=\"term\" data-t=\"limitvalue\">극한값<\/span>을 <span class=\"term\" data-t=\"euler\">자연상수 e<\/span>라 한다.","p2":"<span class=\"v\">e<\/span>는 2.7보다 조금 큰 무리수여서 소수로 끝까지 적을 수 없다. 자라나는 양의 변화를 다룰 때 자주 나타나며, 지수함수와 로그함수를 미분할 때 기준이 되는 밑으로 쓰인다.","eqL":"n&#8594;&#8734;","eqR":"<span class=\"m\">(<\/span><span class=\"m\">1<\/span> <span class=\"m\">+<\/span> <span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"v\">n<\/span><span class=\"m\">)<\/span><sup><span class=\"v\">n<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">e<\/span>"},{"id":"c14","order":14,"no":"개념 14","unit":"II. 지수함수와 로그함수의 미분","sec":"01 지수함수의 극한과 미분","title":"지수함수의 극한 공식","pre":["c13"],"p1":"<span class=\"term\" data-t=\"euler\">자연상수 e<\/span>를 밑으로 하는 지수함수의 <span class=\"term\" data-t=\"derivative\">도함수<\/span>를 정의대로 구하면 마지막에 이 극한 하나가 남는다.","p2":"<span class=\"v\">h<\/span>를 0으로 보내면 분자와 분모가 함께 0이 되는 <span class=\"term\" data-t=\"indeterminate\">부정형<\/span>이라 그대로는 값을 알 수 없다. 그런데 <span class=\"v\">e<\/span>의 정의에서 이 <span class=\"term\" data-t=\"limitvalue\">극한값<\/span>은 정확히 1이 되고, 밑이 <span class=\"v\">e<\/span>일 때만 1이 나온다. 그래서 <span class=\"v\">e<\/span>^<span class=\"v\">x<\/span> 는 미분해도 아무것도 덧붙지 않고 자기 자신이 된다.","eqL":"h&#8594;0","eqR":"<span class=\"m\">(<\/span><span class=\"v\">e<\/span><sup><span class=\"v\">h<\/span><\/sup> - <span class=\"m\">1<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"v\">h<\/span> <span class=\"m\">=<\/span> <span class=\"m\">1<\/span>"},{"id":"c15","order":15,"no":"개념 15","unit":"II. 지수함수와 로그함수의 미분","sec":"01 지수함수의 극한과 미분","title":"지수함수의 미분","pre":["c14"],"p1":"<span class=\"term\" data-t=\"euler\">자연상수 e<\/span>를 밑으로 하는 <span class=\"term\" data-t=\"expfunc\">지수함수<\/span> <span class=\"v\">y<\/span> = <span class=\"v\">e<\/span>^<span class=\"v\">x<\/span> 는 미분해도 모양이 변하지 않는 함수다.","p2":"도함수의 정의에 넣어 정리하면 <span class=\"v\">e<\/span>^<span class=\"v\">x<\/span> 가 밖으로 묶여 나오고 남은 극한이 1이 되기 때문이다. 지수함수 가운데 미분해도 자기 자신이 되는 것은 밑이 <span class=\"v\">e<\/span>일 때뿐이며, 이 성질 덕분에 <span class=\"v\">e<\/span>가 지수함수의 기준 밑으로 쓰인다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">e<\/span><sup><span class=\"v\">x<\/span><\/sup><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">e<\/span><sup><span class=\"v\">x<\/span><\/sup>"},{"id":"c16","order":16,"no":"개념 16","unit":"II. 지수함수와 로그함수의 미분","sec":"01 지수함수의 극한과 미분","title":"일반 지수함수의 미분","pre":["c15"],"p1":"<span class=\"term\" data-t=\"base\">밑<\/span>이 <span class=\"term\" data-t=\"euler\">자연상수 e<\/span>가 아닌 <span class=\"term\" data-t=\"expfunc\">지수함수<\/span> <span class=\"v\">y<\/span> = <span class=\"v\">a<\/span>^<span class=\"v\">x<\/span> (<span class=\"v\">a<\/span> > 0, <span class=\"v\">a<\/span> &#8800; 1)도 같은 방법으로 미분할 수 있다.","p2":"<span class=\"v\">a<\/span>^<span class=\"v\">x<\/span> 는 밑을 <span class=\"v\">e<\/span>로 바꾸면 지수가 <span class=\"v\">x<\/span>에 밑 <span class=\"v\">a<\/span>의 자연로그를 곱한 꼴이 된다. 그 지수가 <span class=\"v\">x<\/span>의 상수배이므로 미분하면 상수인 자연로그가 앞으로 빠져나와 원래 함수에 곱해진다. <span class=\"v\">a<\/span> = <span class=\"v\">e<\/span>이면 그 값이 1이 되어 앞의 공식과 그대로 일치한다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span><sup><span class=\"v\">x<\/span><\/sup><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"v\">x<\/span><\/sup> <span class=\"m\">ln<\/span> <span class=\"v\">a<\/span>"},{"id":"c19","order":17,"no":"개념 19","unit":"II. 지수함수와 로그함수의 미분","sec":"02 연쇄법칙과 로그함수의 미분","title":"합성함수의 미분법","pre":[],"p1":"함수 안에 또 다른 함수가 들어 있는 합성함수는 안쪽 함수와 바깥 함수가 모두 미분가능할 때 <span class=\"term\" data-t=\"chainrule\">연쇄법칙<\/span>으로 미분한다.","p2":"바깥 함수 <span class=\"v\">f<\/span>를 안쪽 함수 <span class=\"v\">g<\/span>가 들어간 그대로 미분한 다음, 안쪽 함수 <span class=\"v\">g<\/span>의 <span class=\"term\" data-t=\"derivative\">도함수<\/span>를 곱한다. 안쪽이 움직인 만큼 바깥이 반응하므로 두 변화율이 차례로 곱해지는 것이다. 뒤에 이어지는 지수함수와 로그함수의 합성 공식은 모두 이 하나에서 나온다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">g<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><span class=\"m\">)<\/span><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">f<\/span>'<span class=\"m\">(<\/span><span class=\"v\">g<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><span class=\"m\">)<\/span> <span class=\"v\">g<\/span>'<span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span>"},{"id":"c17","order":18,"no":"개념 17","unit":"II. 지수함수와 로그함수의 미분","sec":"02 연쇄법칙과 로그함수의 미분","title":"자연로그의 미분","pre":["c19"],"p1":"<span class=\"term\" data-t=\"logfunc\">로그함수<\/span> 가운데 밑이 자연상수 <span class=\"v\">e<\/span>인 <span class=\"term\" data-t=\"naturallog\">자연로그<\/span>는 미분하면 <span class=\"v\">x<\/span>의 역수만 남는다.","p2":"자연로그의 값을 <span class=\"v\">y<\/span>라 두면 <span class=\"v\">e<\/span>의 <span class=\"v\">y<\/span>제곱이 <span class=\"v\">x<\/span>라는 뜻이므로, 양변을 <span class=\"v\">x<\/span>로 미분하면 <span class=\"term\" data-t=\"chainrule\">연쇄법칙<\/span>에 따라 왼쪽에 <span class=\"v\">y<\/span>'가 곱해져 나온다. 그 식을 <span class=\"v\">y<\/span>'에 대해 풀면 <span class=\"v\">e<\/span>의 <span class=\"v\">y<\/span>제곱의 역수, 곧 <span class=\"v\">x<\/span>의 역수가 된다. 로그는 진수가 양수일 때만 정의되므로 <span class=\"v\">x<\/span> > 0인 구간에서 성립한다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"m\">ln<\/span> <span class=\"v\">x<\/span><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"v\">x<\/span>"},{"id":"c18","order":19,"no":"개념 18","unit":"II. 지수함수와 로그함수의 미분","sec":"02 연쇄법칙과 로그함수의 미분","title":"일반 로그함수의 미분","pre":["c17"],"p1":"<span class=\"term\" data-t=\"base\">밑<\/span>이 자연상수 <span class=\"v\">e<\/span>가 아닌 <span class=\"term\" data-t=\"logfunc\">로그함수<\/span>도 밑을 <span class=\"v\">e<\/span>로 바꾸면 같은 방법으로 미분할 수 있다.","p2":"<span class=\"term\" data-t=\"basechange\">밑 변환<\/span>을 쓰면 밑이 <span class=\"v\">a<\/span>인 로그는 <span class=\"v\">x<\/span>의 자연로그를 <span class=\"v\">a<\/span>의 자연로그로 나눈 것과 같다. 분모에 놓인 <span class=\"v\">a<\/span>의 자연로그는 <span class=\"v\">x<\/span>와 관계없는 상수이므로, 미분하면 <span class=\"v\">x<\/span>의 역수에 그 상수의 역수가 곱해진 꼴이 된다. <span class=\"v\">a<\/span> > 0, <span class=\"v\">a<\/span> &#8800; 1이고 <span class=\"v\">x<\/span> > 0일 때 성립한다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"m\">log<\/span><sub><span class=\"v\">a<\/span><\/sub> <span class=\"v\">x<\/span><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span> <span class=\"m\">ln<\/span> <span class=\"v\">a<\/span><span class=\"m\">)<\/span>"},{"id":"c20","order":20,"no":"개념 20","unit":"II. 지수함수와 로그함수의 미분","sec":"03 합성함수의 미분","title":"합성된 지수함수의 미분","pre":["c19"],"p1":"<span class=\"term\" data-t=\"euler\">자연상수 e<\/span>의 지수 자리에 또 다른 함수가 들어간 <span class=\"term\" data-t=\"expfunc\">지수함수<\/span>에도 <span class=\"term\" data-t=\"chainrule\">연쇄법칙<\/span>을 그대로 적용한다.","p2":"<span class=\"v\">e<\/span>를 밑으로 하는 지수함수는 미분해도 모양이 변하지 않으므로 바깥을 미분한 결과가 원래 식과 똑같다. 여기에 지수 자리에 있던 안쪽 함수의 도함수를 곱해 주면 끝난다. 앞의 합성함수 미분법에서 바깥을 지수함수로, 안쪽을 <span class=\"v\">f<\/span>로 둔 경우다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">e<\/span><sup><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><\/sup><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">e<\/span><sup><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><\/sup> <span class=\"v\">f<\/span>'<span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span>"},{"id":"c21","order":21,"no":"개념 21","unit":"II. 지수함수와 로그함수의 미분","sec":"03 합성함수의 미분","title":"합성된 로그함수의 미분","pre":["c19","c17"],"p1":"<span class=\"term\" data-t=\"naturallog\">자연로그<\/span> 안에 또 다른 함수가 들어가면 <span class=\"term\" data-t=\"chainrule\">연쇄법칙<\/span>으로 미분한 결과가 분수 한 꼴로 정리된다.","p2":"바깥의 자연로그를 미분하면 안쪽 함수의 역수가 되고, 여기에 안쪽 함수의 <span class=\"term\" data-t=\"derivative\">도함수<\/span>를 곱하므로 분자에 <span class=\"v\">f<\/span>'(<span class=\"v\">x<\/span>), 분모에 <span class=\"v\">f<\/span>(<span class=\"v\">x<\/span>)가 남는다. 진수에 절댓값을 씌운 것은 <span class=\"v\">f<\/span>(<span class=\"v\">x<\/span>)가 음수인 구간에서도 같은 결과가 나오기 때문이며, 덕분에 <span class=\"v\">f<\/span>(<span class=\"v\">x<\/span>) &#8800; 0이기만 하면 쓸 수 있다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"m\">ln<\/span><span class=\"m\">|<\/span><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><span class=\"m\">|<\/span><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">f<\/span>'<span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span>"},{"id":"c22","order":22,"no":"개념 22","unit":"II. 지수함수와 로그함수의 미분","sec":"03 합성함수의 미분","title":"합성된 일반 지수함수의 미분","pre":["c19","c16"],"p1":"<span class=\"term\" data-t=\"base\">밑<\/span>이 자연상수 <span class=\"v\">e<\/span>가 아닌 <span class=\"term\" data-t=\"expfunc\">지수함수<\/span> <span class=\"v\">y<\/span> = <span class=\"v\">a<\/span>^<span class=\"v\">x<\/span> (<span class=\"v\">a<\/span> > 0, <span class=\"v\">a<\/span> &#8800; 1)에서도 지수 자리에 함수가 들어가면 같은 방식으로 미분한다.","p2":"일반 지수함수를 미분하면 원래 함수에 밑의 <span class=\"term\" data-t=\"naturallog\">자연로그<\/span>가 곱해지고, 여기에 <span class=\"term\" data-t=\"chainrule\">연쇄법칙<\/span>으로 안쪽 함수의 도함수가 한 번 더 곱해진다. 곱하는 세 덩어리의 순서는 결과에 영향을 주지 않는다. <span class=\"v\">a<\/span> = <span class=\"v\">e<\/span>이면 밑의 자연로그가 1이 되어 앞의 공식과 그대로 일치한다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span><sup><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><\/sup><span class=\"m\">)<\/span>' <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"v\">f<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><\/sup> <span class=\"v\">f<\/span>'<span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">ln<\/span> <span class=\"v\">a<\/span>"},{"id":"c23","order":23,"no":"개념 23","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"사인의 덧셈정리 (합)","pre":[],"p1":"두 각을 더한 채로는 <span class=\"term\" data-t=\"trigfunc\">삼각함수<\/span> 값을 바로 읽을 수 없지만, <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>를 쓰면 각각의 각으로 나누어 쓸 수 있다.","p2":"오른쪽은 <span class=\"v\">A<\/span>의 사인과 <span class=\"v\">B<\/span>의 코사인의 곱에, <span class=\"v\">A<\/span>의 코사인과 <span class=\"v\">B<\/span>의 사인의 곱을 더한 꼴이다. 사인과 코사인이 번갈아 나오고, 왼쪽이 합이면 가운데 부호도 그대로 플러스다. 75도처럼 값이 알려지지 않은 각도 45도와 30도의 합으로 보면 계산할 수 있다.","eqL":"","eqR":"<span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> <span class=\"m\">+<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span>"},{"id":"c24","order":24,"no":"개념 24","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"사인의 덧셈정리 (차)","pre":[],"p1":"두 각의 차에 대해서도 같은 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>가 있고, 항이 놓이는 자리는 합일 때와 똑같다.","p2":"합의 공식에서 가운데 부호만 마이너스로 바뀌었다. <span class=\"v\">B<\/span> 자리에 부호를 뒤집은 각을 넣으면 <span class=\"v\">B<\/span>의 사인만 부호가 바뀌므로 이 식이 그대로 나오고, 그래서 둘은 사실상 한 식이다. 모든 각 <span class=\"v\">A<\/span>, <span class=\"v\">B<\/span>에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이라 아는 각을 대입해 검산해도 된다.","eqL":"","eqR":"<span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> - <span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span>"},{"id":"c25","order":25,"no":"개념 25","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"코사인의 덧셈정리 (합)","pre":[],"p1":"코사인의 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>는 같은 종류의 <span class=\"term\" data-t=\"trigfunc\">삼각함수<\/span>끼리 묶인다는 점에서 사인과 다르다.","p2":"오른쪽은 두 코사인의 곱에서 두 사인의 곱을 뺀 꼴이다. 사인처럼 번갈아 섞이지 않고 같은 함수끼리 짝을 이루며, 왼쪽이 합인데 가운데 부호는 마이너스로 뒤집힌다. 이 부호 뒤집힘이 코사인 쪽에서 가장 많이 틀리는 자리다.","eqL":"","eqR":"<span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> - <span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span>"},{"id":"c26","order":26,"no":"개념 26","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"코사인의 덧셈정리 (차)","pre":[],"p1":"두 각의 차에 대한 코사인도 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>로 각각의 값의 곱으로 풀어 쓴다.","p2":"묶이는 방식은 합일 때와 같고 가운데 부호만 플러스로 바뀐다. 왼쪽이 차이면 오른쪽은 합이 되니, 코사인에서는 부호가 항상 반대로 간다고 기억하면 된다. 어느 각에서나 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이라 <span class=\"v\">A<\/span>와 <span class=\"v\">B<\/span>가 같은 경우를 넣어 보면 오른쪽이 1이 되는 것도 확인된다.","eqL":"","eqR":"<span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> <span class=\"m\">+<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span>"},{"id":"c27","order":27,"no":"개념 27","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"탄젠트의 덧셈정리 (합)","pre":[],"p1":"탄젠트의 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>는 사인의 결과를 코사인의 결과로 나눠서 얻으므로 분수 꼴이 된다.","p2":"분자는 두 탄젠트의 합이고, 분모는 1에서 두 탄젠트의 곱을 뺀 값이다. 왼쪽이 합인데 분모의 부호는 마이너스라는 점만 붙잡으면 형태가 흔들리지 않는다. 분모가 0이 되는 각에서는 값이 정의되지 않는데, 이는 탄젠트라는 <span class=\"term\" data-t=\"trigfunc\">삼각함수<\/span> 자체가 정의되지 않는 자리와 이어진다.","eqL":"","eqR":"<span class=\"m\">tan<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">tan<\/span> <span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"m\">tan<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">(<\/span><span class=\"m\">1<\/span> - <span class=\"m\">tan<\/span> <span class=\"v\">A<\/span> <span class=\"m\">tan<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span>"},{"id":"c28","order":28,"no":"개념 28","unit":"III. 삼각함수의 덧셈정리","sec":"01 삼각함수의 덧셈정리","title":"탄젠트의 덧셈정리 (차)","pre":[],"p1":"차에 대한 탄젠트의 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>는 분자와 분모의 부호가 동시에 뒤집힌 꼴이다.","p2":"분자는 두 탄젠트의 차, 분모는 1에 두 탄젠트의 곱을 더한 값이다. 합의 공식에서 <span class=\"v\">B<\/span> 자리에 부호를 뒤집은 각을 넣으면 <span class=\"v\">B<\/span>의 탄젠트만 부호가 바뀌므로 두 자리가 한꺼번에 따라 바뀐 것이다. 분모가 0이 아닌 모든 각에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이다.","eqL":"","eqR":"<span class=\"m\">tan<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">tan<\/span> <span class=\"v\">A<\/span> - <span class=\"m\">tan<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">(<\/span><span class=\"m\">1<\/span> <span class=\"m\">+<\/span> <span class=\"m\">tan<\/span> <span class=\"v\">A<\/span> <span class=\"m\">tan<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span>"},{"id":"c29","order":29,"no":"개념 29","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"사인의 배각공식","pre":["c23"],"p1":"<span class=\"term\" data-t=\"addition\">덧셈정리<\/span>에서 두 각을 같게 놓으면 각이 두 배인 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>이 나온다.","p2":"사인의 합 공식에 <span class=\"v\">B<\/span> 대신 <span class=\"v\">A<\/span>를 넣으면 <span class=\"v\">A<\/span>의 사인과 <span class=\"v\">A<\/span>의 코사인의 곱이 두 번 생겨 2를 곱한 꼴로 정리된다. 각을 두 배로 키워도 사인만으로는 표현되지 않고 코사인이 함께 붙는다는 점이 핵심이다. 거꾸로 읽으면 사인과 코사인의 곱을 각이 두 배인 사인 하나로 줄이는 데 쓴다.","eqL":"","eqR":"<span class=\"m\">sin<\/span> <span class=\"m\">2<\/span><span class=\"v\">A<\/span> <span class=\"m\">=<\/span> <span class=\"m\">2<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">A<\/span>"},{"id":"c30","order":30,"no":"개념 30","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"코사인의 배각공식","pre":[],"p1":"코사인의 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>도 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>에 두 각을 같게 넣어 얻는다.","p2":"합의 공식에서 같은 함수끼리 묶여 있던 두 곱이 각각 제곱이 되어, 코사인의 제곱에서 사인의 제곱을 뺀 형태가 된다. 이것이 세 가지 형태의 출발점이고, 나머지 둘은 여기서 한쪽 함수를 지워 얻는다. 사인과 코사인이 모두 남아 있어 유도와 검산에는 이 꼴이 가장 편하다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"m\">2<\/span><span class=\"v\">A<\/span> <span class=\"m\">=<\/span> <span class=\"m\">cos<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"v\">A<\/span> - <span class=\"m\">sin<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"v\">A<\/span>"},{"id":"c31","order":31,"no":"개념 31","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"코사인의 배각공식 (코사인 꼴)","pre":[],"p1":"식에서 사인을 없애고 싶을 때는 <span class=\"term\" data-t=\"pythagoras\">피타고라스 항등식<\/span>으로 사인의 제곱을 지운 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>을 쓴다.","p2":"사인의 제곱을 1에서 코사인의 제곱을 뺀 값으로 바꿔 넣으면 코사인만 남는다. 코사인의 값 하나만 주어졌거나 코사인에 대한 방정식을 세워야 하는 문제에서 이 형태를 고른다. 거꾸로 읽으면 코사인의 제곱을 각이 두 배인 코사인으로 낮추는 도구가 된다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"m\">2<\/span><span class=\"v\">A<\/span> <span class=\"m\">=<\/span> <span class=\"m\">2<\/span> <span class=\"m\">cos<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"v\">A<\/span> - <span class=\"m\">1<\/span>"},{"id":"c32","order":32,"no":"개념 32","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"코사인의 배각공식 (사인 꼴)","pre":[],"p1":"반대로 코사인을 없애고 사인만 남기고 싶으면 <span class=\"term\" data-t=\"pythagoras\">피타고라스 항등식<\/span>을 반대 방향으로 넣은 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>을 쓴다.","p2":"이번에는 코사인의 제곱을 1에서 사인의 제곱을 뺀 값으로 바꿔 대입한다. 사인의 값만 주어졌거나 사인에 대한 방정식으로 옮겨야 할 때 이 형태가 가장 짧다. 이 식을 사인의 제곱에 대해 풀면 그대로 반각공식으로 이어진다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"m\">2<\/span><span class=\"v\">A<\/span> <span class=\"m\">=<\/span> <span class=\"m\">1<\/span> - <span class=\"m\">2<\/span> <span class=\"m\">sin<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"v\">A<\/span>"},{"id":"c33","order":33,"no":"개념 33","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"탄젠트의 배각공식","pre":[],"p1":"탄젠트의 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>은 탄젠트의 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>에 두 각을 같게 넣어 얻는다.","p2":"분자의 두 탄젠트가 같아져 2를 곱한 꼴이 되고, 분모의 곱은 탄젠트의 제곱이 된다. 분모가 0이 되는 각에서는 각이 두 배인 탄젠트가 정의되지 않는다. 사인과 코사인의 배각을 각각 구해 나누어도 같은 식에 이른다.","eqL":"","eqR":"<span class=\"m\">tan<\/span> <span class=\"m\">2<\/span><span class=\"v\">A<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">2<\/span> <span class=\"m\">tan<\/span> <span class=\"v\">A<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">(<\/span><span class=\"m\">1<\/span> - <span class=\"m\">tan<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"v\">A<\/span><span class=\"m\">)<\/span>"},{"id":"c34","order":34,"no":"개념 34","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"사인의 반각공식","pre":["c32"],"p1":"<span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>을 제곱 쪽으로 풀어 놓고 각을 절반으로 바꿔 읽으면 <span class=\"term\" data-t=\"halfangle\">반각공식<\/span>이 된다.","p2":"코사인의 배각공식 중 사인만 남은 형태를 사인의 제곱에 대해 정리하면, 사인의 제곱이 각을 두 배로 한 코사인 하나로 표현된다. 이때 두 배로 커진 쪽 각을 &#952;라고 부르면 왼쪽에 남는 각은 &#952;의 절반이 되어 위 식이 된다. 절반 각의 사인의 제곱은 원래 각 &#952;의 코사인만 알면 바로 구해진다.","eqL":"","eqR":"<span class=\"m\">sin<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">(<\/span><span class=\"m\">&#952;<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span> - <span class=\"m\">cos<\/span> <span class=\"m\">&#952;<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span>"},{"id":"c35","order":35,"no":"개념 35","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"코사인의 반각공식","pre":[],"p1":"코사인의 <span class=\"term\" data-t=\"halfangle\">반각공식<\/span>도 같은 자리에서 각을 절반으로 바꿔 읽어 얻으며, 사인 쪽과 부호 하나만 다르다.","p2":"코사인만 남은 <span class=\"term\" data-t=\"doubleangle\">배각공식<\/span>을 코사인의 제곱에 대해 풀고 두 배로 커진 쪽 각을 &#952;로 놓으면, 분자가 1에 &#952;의 코사인을 더한 값이 된다. 사인의 반각과 비교하면 분자의 부호만 반대다. 두 식을 더하면 오른쪽이 1이 되어, 절반 각에서도 제곱의 합이 1이라는 것이 확인된다.","eqL":"","eqR":"<span class=\"m\">cos<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">(<\/span><span class=\"m\">&#952;<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span> <span class=\"m\">+<\/span> <span class=\"m\">cos<\/span> <span class=\"m\">&#952;<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span>"},{"id":"c36","order":36,"no":"개념 36","unit":"III. 삼각함수의 덧셈정리","sec":"02 배각공식과 반각공식","title":"탄젠트의 반각공식","pre":[],"p1":"탄젠트의 <span class=\"term\" data-t=\"halfangle\">반각공식<\/span>은 절반 각에 대한 사인과 코사인의 반각을 나눠서 얻는다.","p2":"두 식의 분모에 있던 2가 약분되어, 1에서 &#952;의 코사인을 뺀 값을 1에 &#952;의 코사인을 더한 값으로 나눈 꼴만 남는다. &#952;의 코사인이 -1이 아닌 모든 각에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이다. 세 반각공식 모두 제곱 상태로 주어지므로, 값을 구할 때는 절반 각이 어느 사분면에 있는지 보고 부호를 정해야 한다.","eqL":"","eqR":"<span class=\"m\">tan<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">(<\/span><span class=\"m\">&#952;<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span> - <span class=\"m\">cos<\/span> <span class=\"m\">&#952;<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">(<\/span><span class=\"m\">1<\/span> <span class=\"m\">+<\/span> <span class=\"m\">cos<\/span> <span class=\"m\">&#952;<\/span><span class=\"m\">)<\/span>"},{"id":"c37","order":37,"no":"개념 37","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"곱을 합으로 (사인과 코사인)","pre":[],"p1":"두 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>를 더하거나 빼면 곱이 합으로 풀리는 <span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span> 공식이 나온다.","p2":"사인의 합 공식과 차 공식을 더하면 한쪽 항이 상쇄되고 <span class=\"v\">A<\/span>의 사인과 <span class=\"v\">B<\/span>의 코사인의 곱만 두 번 남는다. 양변을 2로 나누면 위 식이 된다. 곱한 채로는 정리되지 않는 식도 이렇게 합으로 바꾸면 항마다 따로 다룰 수 있다.","eqL":"","eqR":"<span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span><span class=\"m\">[<\/span><span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">+<\/span> <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">]<\/span>"},{"id":"c38","order":38,"no":"개념 38","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"곱을 합으로 (코사인과 사인)","pre":[],"p1":"같은 두 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span>를 더하지 않고 빼면 남는 곱이 달라진다.","p2":"사인의 합 공식에서 차 공식을 빼면 <span class=\"v\">A<\/span>의 코사인과 <span class=\"v\">B<\/span>의 사인의 곱만 두 번 남는다. 앞의 공식과 견주면 오른쪽에 등장하는 두 각은 그대로이고 가운데 부호만 마이너스로 바뀐다. <span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span>에서는 어느 함수가 앞에 오느냐가 이 부호를 정한다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span><span class=\"m\">[<\/span><span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> - <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">]<\/span>"},{"id":"c39","order":39,"no":"개념 39","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"곱을 합으로 (두 코사인)","pre":[],"p1":"코사인끼리의 곱은 코사인의 <span class=\"term\" data-t=\"addition\">덧셈정리<\/span> 두 개를 더해서 얻는다.","p2":"코사인의 합 공식과 차 공식을 더하면 사인끼리의 곱이 상쇄되고 코사인끼리의 곱만 두 번 남는다. 오른쪽이 모두 코사인이고 부호도 플러스라 <span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span> 네 식 중 형태가 가장 단순하다. 곱을 그대로 두면 손댈 데가 없는 식을 항의 합으로 펴는 데 쓴다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"v\">A<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">B<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span><span class=\"m\">[<\/span><span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> <span class=\"m\">+<\/span> <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">]<\/span>"},{"id":"c40","order":40,"no":"개념 40","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"곱을 합으로 (두 사인)","pre":[],"p1":"<span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span> 네 식 가운데 사인끼리의 곱만 앞에 마이너스가 붙는다.","p2":"코사인의 합 공식에서 차 공식을 빼면 사인끼리의 곱이 두 번 남되 부호가 반대로 나오므로, 정리하면 전체 앞에 마이너스가 붙는다. 대괄호 안 두 항의 순서를 뒤집어 쓰면 이 마이너스를 없앨 수도 있다. 어느 쪽으로 적든 모든 각에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이다.","eqL":"","eqR":"<span class=\"m\">sin<\/span> <span class=\"v\">A<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">B<\/span> <span class=\"m\">=<\/span> -<span class=\"m\">(<\/span><span class=\"m\">1<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span><span class=\"m\">[<\/span><span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> <span class=\"m\">+<\/span> <span class=\"v\">B<\/span><span class=\"m\">)<\/span> - <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"v\">A<\/span> - <span class=\"v\">B<\/span><span class=\"m\">)<\/span><span class=\"m\">]<\/span>"},{"id":"c41","order":41,"no":"개념 41","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"합을 곱으로 (두 사인의 합)","pre":[],"p1":"<span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span>을 반대 방향으로 읽으면 두 <span class=\"term\" data-t=\"trigfunc\">삼각함수<\/span>의 합을 하나의 곱으로 묶을 수 있다.","p2":"곱을 합으로 바꾸는 식에서 <span class=\"v\">A<\/span>와 <span class=\"v\">B<\/span> 자리에 두 각의 합의 절반과 차의 절반을 넣으면 대괄호 안이 <span class=\"v\">p<\/span>의 사인과 <span class=\"v\">q<\/span>의 사인의 합이 되고, 양변에 2를 곱하면 위 식이 된다. 오른쪽은 두 각의 평균에 대한 사인과 절반 차이에 대한 코사인의 곱에 2를 곱한 값이다. 합이 0인 방정식은 이렇게 곱으로 바꿔야 각 인수를 0으로 놓고 풀 수 있다.","eqL":"","eqR":"<span class=\"m\">sin<\/span> <span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"m\">sin<\/span> <span class=\"v\">q<\/span> <span class=\"m\">=<\/span> <span class=\"m\">2<\/span> <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> - <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span>"},{"id":"c42","order":42,"no":"개념 42","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"합을 곱으로 (두 사인의 차)","pre":[],"p1":"두 사인의 차를 곱으로 바꿀 때는 <span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span>에서 사인과 코사인의 자리가 서로 바뀐다.","p2":"두 각의 평균 쪽에 코사인이, 절반 차이 쪽에 사인이 붙는다. 합의 공식과 견주면 두 함수가 자리만 맞바꾼 꼴이라 둘을 함께 외우면 헷갈리지 않는다. <span class=\"v\">p<\/span>와 <span class=\"v\">q<\/span>에 어떤 값을 넣어도 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이라, 두 각을 바꿔 넣으면 양변의 부호가 함께 뒤집히는 것도 확인된다.","eqL":"","eqR":"<span class=\"m\">sin<\/span> <span class=\"v\">p<\/span> - <span class=\"m\">sin<\/span> <span class=\"v\">q<\/span> <span class=\"m\">=<\/span> <span class=\"m\">2<\/span> <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> - <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span>"},{"id":"c43","order":43,"no":"개념 43","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"합을 곱으로 (두 코사인의 합)","pre":[],"p1":"두 코사인의 합은 <span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span>으로 코사인끼리의 곱 하나로 묶인다.","p2":"두 각의 평균에도, 절반 차이에도 모두 코사인이 붙고 앞의 부호도 그대로다. 네 식 가운데 형태가 가장 단순해서 <span class=\"term\" data-t=\"trigfunc\">삼각함수<\/span>의 합이 나오는 식에서는 이 꼴부터 떠올려도 좋다. <span class=\"v\">p<\/span>와 <span class=\"v\">q<\/span>가 같으면 뒤쪽 코사인이 1이 되어 양변이 곧바로 맞아떨어지므로, 부호를 잘못 옮겼는지 빠르게 검산할 수 있다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"m\">cos<\/span> <span class=\"v\">q<\/span> <span class=\"m\">=<\/span> <span class=\"m\">2<\/span> <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">cos<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> - <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span>"},{"id":"c44","order":44,"no":"개념 44","unit":"III. 삼각함수의 덧셈정리","sec":"03 곱과 합의 변환","title":"합을 곱으로 (두 코사인의 차)","pre":[],"p1":"<span class=\"term\" data-t=\"prodconv\">곱과 합의 변환<\/span> 네 식 중 두 코사인의 차만 앞에 마이너스가 붙는다.","p2":"왼쪽은 코사인의 차인데 오른쪽에는 사인끼리의 곱이 나오고, 전체에 마이너스가 붙는다. 코사인의 합 공식에서 차 공식을 빼는 과정에서 사인끼리의 곱이 음의 부호로 나오기 때문이다. 모든 각에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이므로 <span class=\"v\">p<\/span>와 <span class=\"v\">q<\/span>를 바꿔 넣어 양변의 부호를 맞춰 보면 이 마이너스가 기억에 남는다.","eqL":"","eqR":"<span class=\"m\">cos<\/span> <span class=\"v\">p<\/span> - <span class=\"m\">cos<\/span> <span class=\"v\">q<\/span> <span class=\"m\">=<\/span> -<span class=\"m\">2<\/span> <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> <span class=\"m\">+<\/span> <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span> <span class=\"m\">sin<\/span><span class=\"m\">(<\/span><span class=\"m\">(<\/span><span class=\"v\">p<\/span> - <span class=\"v\">q<\/span><span class=\"m\">)<\/span><span class=\"m\">/<\/span><span class=\"m\">2<\/span><span class=\"m\">)<\/span>"},{"id":"c45","order":45,"no":"개념 45","unit":"IV. 다항식","sec":"01 곱셈공식","title":"완전제곱식 (합)","pre":[],"p1":"두 항의 합을 제곱하면 각각의 제곱 사이에 두 항의 곱의 두 배가 끼어드는데, 이것이 가장 기본이 되는 <span class=\"term\" data-t=\"perfectsq\">완전제곱식<\/span>이다.","p2":"같은 괄호를 두 번 곱하면서 <span class=\"v\">a<\/span>와 <span class=\"v\">b<\/span>를 서로 곱하는 자리가 두 번 나오기 때문에 가운데 항의 계수가 2가 된다. <span class=\"v\">a<\/span>와 <span class=\"v\">b<\/span>에 어떤 값을 넣어도 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이므로, 기억이 흐릿할 때는 간단한 숫자를 대입해 양변을 맞춰 보면 된다. 뒤에 이어지는 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span> 대부분이 이 전개를 변형한 것이다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">2<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup>"},{"id":"c46","order":46,"no":"개념 46","unit":"IV. 다항식","sec":"01 곱셈공식","title":"완전제곱식 (차)","pre":[],"p1":"차의 제곱은 합의 제곱에서 가운데 항의 부호만 뒤집힌 꼴이다.","p2":"<span class=\"v\">b<\/span> 자리에 부호를 바꾼 값을 넣었다고 보면, 두 번 곱해지는 마지막 항은 음수 둘이 곱해져 다시 양수가 되고 한 번만 곱해지는 가운데 항만 음수가 된다. 그래서 <span class=\"term\" data-t=\"perfectsq\">완전제곱식<\/span> 두 개는 사실상 한 식이고, 확인할 부호는 가운데 하나뿐이다. 부호를 바꿔 끼워 식을 하나 더 얻는 이 방식은 뒤의 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>에서도 계속 반복된다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> - <span class=\"v\">b<\/span><span class=\"m\">)<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"m\">2<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup>"},{"id":"c47","order":47,"no":"개념 47","unit":"IV. 다항식","sec":"01 곱셈공식","title":"합차공식","pre":[],"p1":"두 수의 합과 차를 곱해 펼치면 가운데 두 항이 서로 지워지고 제곱의 차만 남는다.","p2":"하나씩 곱해 네 항을 만들면 <span class=\"v\">a<\/span>와 <span class=\"v\">b<\/span>의 곱이 부호만 다르게 두 번 나와 서로 더해져 0이 되기 때문이다. 네 항 중 둘이 사라지는 유일한 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>이라 전개 결과가 눈에 띄게 짧다. 103 곱하기 97처럼 어떤 수에서 같은 만큼 크고 작은 두 수를 곱할 때 이 <span class=\"term\" data-t=\"diffsq\">합차공식<\/span>을 쓰면 암산으로 끝난다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span> - <span class=\"v\">b<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup>"},{"id":"c48","order":48,"no":"개념 48","unit":"IV. 다항식","sec":"01 곱셈공식","title":"두 일차식의 곱 (계수가 1)","pre":[],"p1":"<span class=\"v\">x<\/span>의 계수가 1인 두 일차식을 곱하면 두 상수의 합이 <span class=\"v\">x<\/span>의 계수 자리로, 두 상수의 곱이 상수항 자리로 내려온다.","p2":"각 괄호에서 한 항씩 골라 곱한 네 개를 더할 때, <span class=\"v\">x<\/span>가 하나만 들어간 두 항이 묶여 가운데 계수를 만든다. 이 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>은 거꾸로 쓰이는 일이 더 많아서, 이차식을 보면 곱이 상수항이고 합이 <span class=\"v\">x<\/span>의 계수인 두 수를 찾는 작업이 된다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">a<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">x<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">a<\/span><span class=\"v\">b<\/span>"},{"id":"c49","order":49,"no":"개념 49","unit":"IV. 다항식","sec":"01 곱셈공식","title":"두 일차식의 곱 (계수가 1이 아닐 때)","pre":[],"p1":"<span class=\"v\">x<\/span>의 계수가 1이 아니면 가운데 항의 계수가 두 괄호를 엇갈려 곱한 값들의 합으로 나온다.","p2":"이차항은 앞의 계수끼리, 상수항은 뒤의 계수끼리 곱한 것이고 가운데만 대각선으로 엇갈려 곱한 뒤 더한다. 두 괄호의 계수를 세로로 나란히 적고 대각선을 그어 확인하는 방법이 이 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>의 표준적인 사용법이다. <span class=\"v\">a<\/span>와 <span class=\"v\">c<\/span>가 모두 1이면 계수가 1인 경우의 식으로 그대로 돌아간다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">c<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">d<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><span class=\"v\">c<\/span><span class=\"v\">x<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">(<\/span><span class=\"v\">a<\/span><span class=\"v\">d<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"v\">c<\/span><span class=\"m\">)<\/span><span class=\"v\">x<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"v\">d<\/span>"},{"id":"c50","order":50,"no":"개념 50","unit":"IV. 다항식","sec":"01 곱셈공식","title":"세 수의 합의 제곱","pre":[],"p1":"항이 셋으로 늘어나면 각각의 제곱에 더해, 서로 다른 두 항을 짝지은 곱이 모두 두 배씩 붙는다.","p2":"세 항에서 두 개를 고르는 짝이 세 가지이고 각 짝은 곱하는 순서가 둘씩 있어 계수 2가 붙는다. 항이 둘일 때의 <span class=\"term\" data-t=\"perfectsq\">완전제곱식<\/span>과 구조가 같으니, 항이 넷으로 늘어도 규칙은 그대로 이어진다. 이 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>은 세 수의 합과 두 수씩의 곱의 합을 알려 주고 제곱의 합을 묻는 문제에서 곧바로 쓰인다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">c<\/span><span class=\"m\">)<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">c<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">2<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"m\">2<\/span><span class=\"v\">b<\/span><span class=\"v\">c<\/span> <span class=\"m\">+<\/span> <span class=\"m\">2<\/span><span class=\"v\">c<\/span><span class=\"v\">a<\/span>"},{"id":"c51","order":51,"no":"개념 51","unit":"IV. 다항식","sec":"02 세제곱 공식","title":"완전세제곱식 (합)","pre":[],"p1":"제곱에서 세제곱으로 올라가면 가운데에 계수가 3인 항이 두 개 생긴다.","p2":"합의 제곱을 펼친 뒤 거기에 다시 같은 합을 한 번 더 곱해 정리하면 나오는 결과다. <span class=\"v\">a<\/span>의 차수가 셋에서 영까지 한 칸씩 내려가는 동안 <span class=\"v\">b<\/span>의 차수는 반대로 올라가고, 계수는 1, 3, 3, 1로 좌우 대칭이라 순서가 잘 기억된다. 이 <span class=\"term\" data-t=\"perfectcube\">완전세제곱식<\/span>은 제곱식보다 항이 넷으로 늘지만 규칙은 가장 뚜렷한 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>이다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"m\">3<\/span><span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"m\">3<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">3<\/span><\/sup>"},{"id":"c52","order":52,"no":"개념 52","unit":"IV. 다항식","sec":"02 세제곱 공식","title":"완전세제곱식 (차)","pre":[],"p1":"차의 세제곱은 네 항의 부호가 하나 건너 하나씩 번갈아 나온다.","p2":"<span class=\"v\">b<\/span> 자리에 부호를 바꾼 값을 넣으면 <span class=\"v\">b<\/span>가 홀수 번 곱해진 항만 음수로 남기 때문이다. 계수 1, 3, 3, 1은 합일 때와 똑같고 부호만 다르므로 <span class=\"term\" data-t=\"perfectcube\">완전세제곱식<\/span>은 사실상 한 식만 외워도 된다. 제곱일 때와 달리 맨 뒤 항까지 음수가 된다는 점이 구별해야 할 지점이다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> - <span class=\"v\">b<\/span><span class=\"m\">)<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">3<\/span><\/sup> - <span class=\"m\">3<\/span><span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"m\">3<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"v\">b<\/span><sup><span class=\"m\">3<\/span><\/sup>"},{"id":"c53","order":53,"no":"개념 53","unit":"IV. 다항식","sec":"02 세제곱 공식","title":"세제곱의 합","pre":[],"p1":"두 수의 합에 특정한 이차식을 곱하면 중간 항이 모두 지워지고 세제곱의 합만 남는다.","p2":"펼치면 여섯 항이 나오는데 부호가 반대인 것끼리 두 쌍이 짝을 이뤄 사라지고 양 끝만 살아남는다. 왼쪽에서 오른쪽으로 읽으면 곱셈공식이고 오른쪽에서 왼쪽으로 읽으면 <span class=\"term\" data-t=\"factorize\">인수분해<\/span> 공식이라, <span class=\"term\" data-t=\"cubefac\">세제곱의 합과 차<\/span>는 두 방향 모두로 쓰인다. 앞 괄호가 합일 때 뒤 괄호의 가운데 항은 빼기라는 점만 놓치지 않으면 된다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"v\">a<\/span><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">3<\/span><\/sup>"},{"id":"c54","order":54,"no":"개념 54","unit":"IV. 다항식","sec":"02 세제곱 공식","title":"세제곱의 차","pre":[],"p1":"두 수의 차에 곱하는 이차식에서는 가운데 항의 부호가 반대로 뒤집힌다.","p2":"앞 괄호가 차이면 뒤 괄호의 가운데는 더하기, 앞 괄호가 합이면 가운데는 빼기로 둘은 항상 어긋난다. 이 규칙 하나만 잡아 두면 <span class=\"term\" data-t=\"cubefac\">세제곱의 합과 차<\/span> 두 식을 서로 바꿔 쓰는 실수가 없다. 세제곱의 차 꼴이 보이는 순간 두 인수의 곱으로 바로 <span class=\"term\" data-t=\"factorize\">인수분해<\/span>할 수 있어 계산이 크게 줄어든다.","eqL":"","eqR":"<span class=\"m\">(<\/span><span class=\"v\">a<\/span> - <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">a<\/span><span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">a<\/span><sup><span class=\"m\">3<\/span><\/sup> - <span class=\"v\">b<\/span><sup><span class=\"m\">3<\/span><\/sup>"},{"id":"c55","order":55,"no":"개념 55","unit":"IV. 다항식","sec":"03 나머지정리와 인수분해","title":"다항식의 나눗셈","pre":[],"p1":"다항식도 수처럼 나눌 수 있고, 몫과 나머지가 만족하는 관계식은 자연수를 나눌 때와 같은 모양이다.","p2":"<span class=\"v\">A<\/span>(<span class=\"v\">x<\/span>)를 <span class=\"v\">B<\/span>(<span class=\"v\">x<\/span>)로 나눈 몫이 <span class=\"v\">Q<\/span>(<span class=\"v\">x<\/span>), 나머지가 <span class=\"v\">R<\/span>(<span class=\"v\">x<\/span>)이며 나누는 식은 <span class=\"v\">B<\/span>(<span class=\"v\">x<\/span>) &#8800; 0이어야 한다. 핵심 조건은 나머지 <span class=\"v\">R<\/span>(<span class=\"v\">x<\/span>)의 차수가 나누는 식 <span class=\"v\">B<\/span>(<span class=\"v\">x<\/span>)의 차수보다 반드시 낮다는 것으로, 이 조건이 있어야 몫과 나머지가 하나로 정해진다. 모든 <span class=\"v\">x<\/span>에서 성립하는 <span class=\"term\" data-t=\"identity\">항등식<\/span>이므로 양변에 편한 값을 대입할 수 있고, <span class=\"term\" data-t=\"polydiv\">다항식의 나눗셈<\/span> 문제는 대개 이 식을 세우는 데서 출발한다.","eqL":"","eqR":"<span class=\"v\">A<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"v\">B<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span><span class=\"v\">Q<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">+<\/span> <span class=\"v\">R<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span>"},{"id":"c56","order":56,"no":"개념 56","unit":"IV. 다항식","sec":"03 나머지정리와 인수분해","title":"나머지정리","pre":["c55"],"p1":"일차식으로 나눈 나머지는 직접 나눠 보지 않고 값 하나를 대입하는 것만으로 구할 수 있다.","p2":"<span class=\"term\" data-t=\"polydiv\">나눗셈<\/span> 관계식에서 나누는 식이 일차식 <span class=\"v\">x<\/span> - <span class=\"v\">a<\/span>이면 나머지의 차수는 그보다 낮아야 하므로 나머지는 상수다. 여기에 <span class=\"v\">x<\/span> 대신 <span class=\"v\">a<\/span>를 대입하면 오른쪽 첫 항이 0이 되어 그 상수가 곧 <span class=\"v\">P<\/span>(<span class=\"v\">a<\/span>)임이 드러난다. 이것이 <span class=\"term\" data-t=\"remtheorem\">나머지정리<\/span>이며, 삼차 이상 다항식의 긴 나눗셈을 대입 한 번으로 대신하게 해 준다.","eqL":"","eqR":"<span class=\"v\">P<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"v\">x<\/span> - <span class=\"v\">a<\/span><span class=\"m\">)<\/span><span class=\"v\">Q<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">+<\/span> <span class=\"v\">P<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span><span class=\"m\">)<\/span>"},{"id":"c57","order":57,"no":"개념 57","unit":"IV. 다항식","sec":"03 나머지정리와 인수분해","title":"인수정리","pre":["c56"],"p1":"<span class=\"term\" data-t=\"remtheorem\">나머지정리<\/span>에서 나머지가 0인 경우만 따로 떼어 낸 것이 <span class=\"term\" data-t=\"factheorem\">인수정리<\/span>다.","p2":"<span class=\"v\">P<\/span>(<span class=\"v\">a<\/span>) = 0이면 나머지가 0이므로 나눗셈 관계식의 마지막 항이 사라져 위와 같이 쓸 수 있고, 이는 <span class=\"v\">x<\/span> - <span class=\"v\">a<\/span>가 <span class=\"v\">P<\/span>(<span class=\"v\">x<\/span>)의 인수라는 뜻이다. 거꾸로 <span class=\"v\">x<\/span> - <span class=\"v\">a<\/span>가 인수여서 위 꼴로 쓰이면 <span class=\"v\">a<\/span>를 대입한 값이 0이 되므로, 두 조건은 서로 같은 말이다. 그래서 고차식을 인수분해할 때는 <span class=\"v\">P<\/span>(<span class=\"v\">a<\/span>) = 0이 되는 <span class=\"v\">a<\/span>를 먼저 찾고, 남은 몫 <span class=\"v\">Q<\/span>(<span class=\"v\">x<\/span>)는 <span class=\"term\" data-t=\"synthdiv\">조립제법<\/span>으로 빠르게 구한다.","eqL":"","eqR":"<span class=\"v\">P<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"v\">x<\/span> - <span class=\"v\">a<\/span><span class=\"m\">)<\/span><span class=\"v\">Q<\/span><span class=\"m\">(<\/span><span class=\"v\">x<\/span><span class=\"m\">)<\/span>"},{"id":"c58","order":58,"no":"개념 58","unit":"IV. 다항식","sec":"03 나머지정리와 인수분해","title":"인수분해와 곱셈공식","pre":["c47"],"p1":"<span class=\"term\" data-t=\"factorize\">인수분해<\/span>는 새로 외울 공식이 아니라 이미 배운 <span class=\"term\" data-t=\"mulform\">곱셈공식<\/span>을 오른쪽에서 왼쪽으로 되읽는 일이다.","p2":"펼쳐진 결과를 보고 원래의 곱을 되찾는 방향이므로, 앞의 공식들을 좌변과 우변만 바꿔 적으면 그대로 인수분해 공식이 된다. 위 식은 제곱의 차를 만나면 <span class=\"term\" data-t=\"diffsq\">합차공식<\/span>의 꼴로 묶으면 된다는 뜻이고, 완전제곱식이나 세제곱 공식도 같은 방식으로 되돌려 읽는다. 그래서 인수분해의 첫걸음은 주어진 식이 아는 공식을 펼친 결과인지 알아보는 것이다.","eqL":"","eqR":"<span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span> - <span class=\"v\">b<\/span><span class=\"m\">)<\/span>"},{"id":"c59","order":59,"no":"개념 59","unit":"IV. 다항식","sec":"03 나머지정리와 인수분해","title":"세 수의 세제곱의 합","pre":["c53"],"p1":"세 문자의 세제곱을 더한 뒤 세 문자의 곱의 세 배를 빼면, 곱셈공식을 뒤집는 것만으로는 나오지 않는 인수분해가 가능해진다.","p2":"오른쪽 두 번째 괄호는 각각의 제곱을 모두 더한 뒤 두 개씩 짝지은 곱을 모두 뺀 꼴이라, <span class=\"term\" data-t=\"cubefac\">세제곱의 합<\/span> 공식을 문자 셋으로 넓힌 모양으로 볼 수 있다. 실제로 <span class=\"v\">c<\/span>에 0을 넣으면 문자 둘일 때의 세제곱의 합 공식으로 되돌아간다. 좌변이 0이라는 조건이 주어지면 세 수의 합이 0이거나 세 수가 모두 같다는 두 갈래로 결론이 갈리므로, 조건식이 붙은 <span class=\"term\" data-t=\"factorize\">인수분해<\/span> 문제에서 자주 나온다.","eqL":"","eqR":"<span class=\"v\">a<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">3<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">c<\/span><sup><span class=\"m\">3<\/span><\/sup> - <span class=\"m\">3<\/span><span class=\"v\">a<\/span><span class=\"v\">b<\/span><span class=\"v\">c<\/span> <span class=\"m\">=<\/span> <span class=\"m\">(<\/span><span class=\"v\">a<\/span> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span> <span class=\"m\">+<\/span> <span class=\"v\">c<\/span><span class=\"m\">)<\/span><span class=\"m\">(<\/span><span class=\"v\">a<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">b<\/span><sup><span class=\"m\">2<\/span><\/sup> <span class=\"m\">+<\/span> <span class=\"v\">c<\/span><sup><span class=\"m\">2<\/span><\/sup> - <span class=\"v\">a<\/span><span class=\"v\">b<\/span> - <span class=\"v\">b<\/span><span class=\"v\">c<\/span> - <span class=\"v\">c<\/span><span class=\"v\">a<\/span><span class=\"m\">)<\/span>"}]};

function apply(){

  s.style.zIndex=String(20-Math.round(ad*10));

 }

var settleTimer=null;
function settle(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 prog=to;idx=Math.round(to);apply();
 countExposure(idx);
 if(typeof markTOC==='function')markTOC();
 if(typeof saveLast==='function')saveLast();
 if(done)done();
}
function animateTo(to,done){
 if(anim){cancelAnimationFrame(anim);anim=null;}
 if(settleTimer){clearTimeout(settleTimer);settleTimer=null;}
 if(document.hidden){ settle(to,done); return; }
 var from=prog,t0=performance.now(),dur=Math.max(140,SPEED*Math.min(1,Math.abs(to-from)+.35));
 var finished=false;
 settleTimer=setTimeout(function(){ if(!finished) settle(to,done); }, dur+400);
 (function step(now){
  var k=Math.min(1,(now-t0)/dur);
  var e=1-Math.pow(1-k,3);
  prog=from+(to-from)*e;apply();
  if(k<1)anim=requestAnimationFrame(step);
  else{finished=true;settle(to,done);}
 })(t0);
}
apply();
window.addEventListener('resize',apply);
document.addEventListener('visibilitychange',function(){
 if(document.hidden && (anim||settleTimer)) settle(Math.round(prog));
});

// ---- 팁개념 스택: 여러 개를 동시에 열어 쌓아둡니다 ----
// 배경 1탭 = 맨 위 하나만 닫기 / 배경 슬라이드 = 전부 닫기
var POPS=[];              // [{key, el, timer, step}]
var MAXPOP=5;             // 그 이상은 가장 오래된 것부터 밀어냅니다

function relHTML(key){

function paintPop(p){
 var t=TIPS[p.key], s=t.steps[p.step], el=p.el;
 el.querySelectorAll('.pt').forEach(function(c){
  var i=+c.getAttribute('data-i'),on=i<s.show;

  c.style.opacity=on?1:0;

// ---- 팝업 높이: 헤더(핸들)를 위아래로 끌어 조절합니다. 값은 기억해 둡니다. ----
var PH_KEY='mathtip_poph_v1';

 var v=parseFloat(localStorage.getItem(PH_KEY));
 return (isNaN(v)||v<36||v>90) ? 64 : v;
})();

}
function setPopHeight(v,save){
