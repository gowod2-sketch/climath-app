function attachResize(el){
 var head=el.querySelector('.pophead'); if(!head) return;
 var st=null;
 head.addEventListener('pointerdown',function(e){
  e.preventDefault(); e.stopPropagation();
  head.setPointerCapture(e.pointerId);
  st={y:e.clientY,h:POPH,moved:false};
  el.classList.add('sizing');
 });
 head.addEventListener('pointermove',function(e){
  if(!st) return;
  e.preventDefault(); e.stopPropagation();
  var dy=e.clientY-st.y;
  if(Math.abs(dy)>4) st.moved=true;
  var stageH=stage.getBoundingClientRect().height||1;
  setPopHeight(st.h - dy/stageH*100, false);
 });
 function done(e){
  if(!st) return;
  e.stopPropagation();
  var dy=e.clientY-st.y, moved=st.moved;
  st=null;
  el.classList.remove('sizing');
  var stageH=stage.getBoundingClientRect().height||1;
  // ?꾨옒濡??ш쾶 ?대━硫??リ린
  if(dy/stageH*100 > 22){ setPopHeight(64,true); popOne(); return; }
  if(moved) setPopHeight(POPH,true);
 }
 head.addEventListener('pointerup',done);
 head.addEventListener('pointercancel',done);
}

var FADE_END=20, RETIRE=40;
var C_ON=[0x4C,0x5F,0xD5], C_OFF=[0x1B,0x20,0x33];
function expoStyle(n){
 var t=Math.min(1,Math.max(0,(n-1)/(FADE_END-1)));
 var e=Math.pow(t,0.85);
 var r=Math.round(C_ON[0]+(C_OFF[0]-C_ON[0])*e),
     g=Math.round(C_ON[1]+(C_OFF[1]-C_ON[1])*e),
     b=Math.round(C_ON[2]+(C_OFF[2]-C_ON[2])*e);
 return {color:'rgb('+r+','+g+','+b+')', weight:Math.round(700-300*e)};
}
function styleTerms(){
 document.querySelectorAll('.term').forEach(function(el){
  var k=el.getAttribute('data-t'), n=EXPO[k]||0;
  if(n>RETIRE && !(typeof REVIVE!=='undefined' && REVIVE)){ el.classList.add('retired'); return; }
  if(n>RETIRE && typeof REVIVE!=='undefined' && REVIVE){
   el.classList.remove('retired');
   el.style.color='var(--accent)'; el.style.fontWeight=600; el.style.fontVariationSettings="'wght' 600";
   return;
  }
  el.classList.remove('retired');
  var st=expoStyle(Math.max(1,n));
  el.style.color=st.color;
  el.style.fontWeight=st.weight;
  el.style.fontVariationSettings="'wght' "+st.weight;
 });
}

function inkCanvas(i){ return sheets[i].querySelector('.inkc'); }
function fitCanvas(cv){
 var r=cv.parentNode.getBoundingClientRect(), d=window.devicePixelRatio||1;
 if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
 }
 var g=null;

 if(!g) return null;            // 罹붾쾭?ㅻ? 紐??곕뒗 ?섍꼍?댁뼱?????꾩껜媛 硫덉텛吏 ?딅룄濡? g.setTransform(d,0,0,d,0,0); return g;
}
function strokePath(g,s,w,h){
 if(!s.p||s.p.length<2) return;
 g.strokeStyle=s.c||INK_DEFAULT; g.lineWidth=s.w||2.4;
 g.beginPath();
 g.moveTo(s.p[0][0]*w, s.p[0][1]*h);
 for(var k=1;k<s.p.length;k++) g.lineTo(s.p[k][0]*w, s.p[k][1]*h);
 g.stroke();
}
function redraw(i){
 var cv=inkCanvas(i); if(!cv) return;
 var g=fitCanvas(cv); if(!g) return;
 var r=cv.parentNode.getBoundingClientRect();
 g.clearRect(0,0,r.width,r.height);
 g.lineCap='round'; g.lineJoin='round';
 (INK[i]||[]).forEach(function(st){ strokePath(g,normStroke(st),r.width,r.height); });
}

 var list=INK[i]; if(!list||!list.length) return false;
 var cv=inkCanvas(i); if(!cv) return false;
 var r=cv.parentNode.getBoundingClientRect();
 var R=14/Math.max(1,r.width);              // 吏?곌컻 諛섍꼍(媛濡쒗룺 湲곗? ?뺢퇋??
 var Ry=14/Math.max(1,r.height);
 var hit=-1;
 for(var s=list.length-1;s>=0 && hit<0;s--){
  var pts=normStroke(list[s]).p||[];
  for(var k=0;k<pts.length;k++){
   var dx=(pts[k][0]-nx)/R, dy=(pts[k][1]-ny)/Ry;

  }

 list.splice(hit,1); saveInk(); redraw(i);
 return true;
}

  // ???먭??쎌쑝濡??꾧린 紐⑤뱶瑜??섍컝 ???덉뒿?덈떎. (?ㅻⅨ ?몃뱾?щ뒗 penOn ?쇰줈 ?대? 留됲? ?덉뒿?덈떎)

 });

var ZOOM=[];   // {s, x, y}
function zoomState(i){ return ZOOM[i] || (ZOOM[i]={s:1,x:0,y:0}); }
function zoomWrap(i){ return sheets[i] && sheets[i].querySelector('.zoomwrap'); }
var MINS=1, MAXS=3.2;

function applyZoom(i,animate){
 var z=zoomState(i), w=zoomWrap(i); if(!w) return;
 var sh=sheets[i];
 // ?뺣? ?곹깭?먯꽌 鍮?怨듦컙??蹂댁씠吏 ?딅룄濡??대룞踰붿쐞瑜??쒗븳
 var r=sh.getBoundingClientRect();
 var maxX=Math.max(0,(z.s-1)*r.width), maxY=Math.max(0,(z.s-1)*r.height);
 z.x=Math.min(0,Math.max(-maxX,z.x));
 z.y=Math.min(0,Math.max(-maxY,z.y));
 w.style.transition=animate?'transform .22s cubic-bezier(.2,.8,.25,1)':'none';
 w.style.transform='translate('+z.x.toFixed(1)+'px,'+z.y.toFixed(1)+'px) scale('+z.s.toFixed(3)+')';
 sh.classList.toggle('zoomed', z.s>1.01);
 var badge=sh.querySelector('.zoombadge');
 if(badge){ badge.textContent=z.s.toFixed(1)+'횞'; badge.classList.toggle('on', z.s>1.01); }
}
function resetZoom(i,animate){
 var z=zoomState(i); z.s=1; z.x=0; z.y=0; applyZoom(i,animate!==false);
}
function isZoomed(i){ return zoomState(i).s>1.01; }

var pts={}, pinch=null, longTimer=null, longStart=null;

function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  if(penOn){ pts={}; setPen(false); return; }

 if(longStart && longTimer){
  // 議곌툑?대씪???吏곸씠硫?湲멸쾶?꾨Ⅴ湲?痍⑥냼 (?섍?/?ㅽ겕濡??섎룄)
  if(Math.abs(e.clientX-longStart.x)>9||Math.abs(e.clientY-longStart.y)>9){
