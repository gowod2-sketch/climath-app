<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathuit 개념 편집기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --s2:#ffffff;--s1:#EEF1FA;--s0:#F4F6FC;
  --text:#1B2033;--text2:#5A6480;--muted:#98A0B8;
  --border:rgba(27,32,51,.10);--border2:rgba(27,32,51,.18);
  --accent:#4C5FD5;--accent2:#7B5CE6;
  --ok:#12A97A;--ok-bg:#E3F6EF;--err:#E0483E;--err-bg:#FDEAE8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--s0);}
body{font-family:"Pretendard Variable",-apple-system,sans-serif;color:var(--text);padding:20px;}
.container{max-width:900px;margin:0 auto;background:var(--s2);border-radius:12px;padding:30px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
h1{margin:0 0 6px;font-size:28px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
.tabs{display:flex;gap:10px;margin-bottom:30px;border-bottom:2px solid var(--border);}
.tab{padding:10px 20px;cursor:pointer;font-size:15px;font-weight:600;color:var(--muted);border:none;background:none;transition:all .3s;}
.tab.active{color:var(--accent);border-bottom:3px solid var(--accent);margin-bottom:-2px;}
.tab-content{display:none;}
.tab-content.active{display:block;}

.loadbar{display:flex;gap:10px;align-items:flex-end;margin-bottom:26px;padding:14px;background:var(--s1);border-radius:10px;}
.loadbar .form-group{flex:1;margin-bottom:0;}
.loadbar label{margin-bottom:6px;}

.form-group{margin-bottom:20px;}
label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
input[type="text"],input[type="number"],textarea,select{
  width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:8px;
  font-family:inherit;font-size:14px;color:var(--text);background:var(--s1);
  transition:border .2s;
}
input[type="text"]:focus,input[type="number"]:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);background:var(--s2);
}
textarea{resize:vertical;min-height:120px;font-family:"Monaco","Courier New",monospace;font-size:13px;}

.steps-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.steps-table th{background:var(--s1);padding:8px;text-align:left;font-size:12px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border2);}
.steps-table td{padding:8px;border-bottom:1px solid var(--border);}
.steps-table input{width:100%;padding:6px 8px;font-size:12px;}

.button-group{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;}
button{padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(76,95,213,.3);}
.btn-secondary{background:var(--s1);color:var(--text);border:1px solid var(--border2);}
.btn-secondary:hover{background:var(--border2);}
.btn-copy{background:#12A97A;color:#fff;}
.btn-copy:hover{background:#0d8f63;}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

.status{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.6;display:none;}
.status.show{display:block;}
.status.ok{background:var(--ok-bg);color:var(--ok);}
.status.err{background:var(--err-bg);color:var(--err);}
.status.pending{background:var(--s1);color:var(--text2);}

.output-section{margin-top:20px;padding:20px;background:var(--s0);border-radius:8px;display:none;}
.output-section.active{display:block;}
.output-section h3{margin:0 0 12px;font-size:14px;color:var(--text2);}
.output-text{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:12px;
  font-family:"Monaco","Courier New",monospace;font-size:12px;line-height:1.6;
  color:var(--text);max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}

.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;}
</style>
</head>
<body>

<div class="container">
<h1>Mathuit 개념 편집기</h1>
<div class="sub">저장하면 GitHub에 바로 commit되고, Netlify가 자동으로 빌드·배포합니다 (2~3분).</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('concept')">개념</button>
  <button class="tab" onclick="switchTab('tip')">팁개념</button>
</div>

<!-- 개념 탭 -->
<div id="concept" class="tab-content active">
  <div class="loadbar">
    <div class="form-group">
      <label>기존 파일 불러오기</label>
      <select id="c_load_select"><option value="">불러올 파일 선택...</option></select>
    </div>
    <button class="btn-secondary" onclick="loadConcept()">불러오기</button>
    <button class="btn-secondary" onclick="newConcept()">새로 작성</button>
  </div>

  <div class="form-group">
    <label>파일명 (예: c02.md — 새로 만들 때만 정하면 됩니다)</label>
    <input type="text" id="c_filename" placeholder="c02.md">
  </div>

  <div class="form-group">
    <label>개념 번호 (예: 개념 01)</label>
    <input type="text" id="c_no" placeholder="개념 01">
  </div>

  <div class="form-group">
    <label>제목</label>
    <input type="text" id="c_title" placeholder="수열의 수렴과 발산">
  </div>

  <div class="form-group">
    <label>단원 (예: I. 수열의 극한)</label>
    <input type="text" id="c_unit" placeholder="I. 수열의 극한">
  </div>

  <div class="form-group">
    <label>섹션 (예: 01 수열의 극한)</label>
    <input type="text" id="c_sec" placeholder="01 수열의 극한">
  </div>

  <div class="form-group">
    <label>순서 (숫자)</label>
    <input type="number" id="c_order" value="1">
  </div>

  <div class="form-group">
    <label>본문</label>
    <textarea id="c_body" placeholder="수열 {a_n}에서 n의 값이 한없이 커질 때, 일반항 a_n의 값이 일정한 값 L에 한없이 가까워지면 이 수열은 L에 [[converge|수렴]]한다고 하며...

$$ lim_{n->oo} a_n = L $$

팁개념 링크: [[id|보이는 글자]]
특수기호: -> (→), oo (∞), -oo (−∞), <= (≤), >= (≥), != (≠), +- (±), alpha (α), beta (β)"></textarea>
  </div>

  <div class="button-group">
    <button class="btn-primary" onclick="saveConcept()" id="c_save_btn">저장하고 배포</button>
    <button class="btn-secondary" onclick="previewConcept()">md 미리보기</button>
  </div>
  <div class="status" id="c_status"></div>
</div>

<!-- 팁개념 탭 -->
<div id="tip" class="tab-content">
  <div class="loadbar">
    <div class="form-group">
      <label>기존 파일 불러오기</label>
      <select id="t_load_select"><option value="">불러올 파일 선택...</option></select>
    </div>
    <button class="btn-secondary" onclick="loadTip()">불러오기</button>
    <button class="btn-secondary" onclick="newTip()">새로 작성</button>
  </div>

  <div class="form-group">
    <label>팁개념 ID (파일명, 영문 소문자 — 기존 것을 불러왔으면 바꾸지 마세요)</label>
    <input type="text" id="t_id" placeholder="converge">
  </div>

  <div class="form-group">
    <label>제목</label>
    <input type="text" id="t_title" placeholder="수렴">
  </div>

  <div class="form-group">
    <label>아이콘 (한 글자)</label>
    <input type="text" id="t_icon" placeholder="→" maxlength="1">
  </div>

  <div class="form-group">
    <label>한줄 설명</label>
    <input type="text" id="t_oneline" placeholder="n이 한없이 커질 때 a_n이 한 값에 한없이 가까워짐">
  </div>

  <div class="form-group">
    <label>관련 팁개념 (쉼표로 구분, 예: limitvalue, diverge)</label>
    <input type="text" id="t_related" placeholder="limitvalue, diverge">
  </div>

  <div class="form-group">
    <label>그래프 곡선식</label>
    <input type="text" id="t_curve" placeholder="60 + 80/n">
    <div class="note">자주 쓰는 식: 위에서 수렴(60 + 80/n), 아래에서 수렴(150 - 90/n), 무한대 발산(152 - 10.5*n), 진동(n%2==1 ? 136 : 64)</div>
  </div>

  <div class="form-group">
    <label>보조선 y좌표 (쉼표로 구분, 예: 60 또는 64, 136)</label>
    <input type="text" id="t_lines" placeholder="60">
  </div>

  <div class="form-group">
    <label>라벨 텍스트</label>
    <input type="text" id="t_label" placeholder="y = L">
  </div>

  <div class="form-group">
    <label>라벨 위치</label>
    <select id="t_label_at">
      <option value="right">오른쪽</option>
      <option value="left">왼쪽</option>
      <option value="center">중앙</option>
    </select>
  </div>

  <div class="form-group">
    <label>애니메이션 스텝 (표 형식: show | line | label | caption)</label>
    <table class="steps-table">
      <thead>
        <tr>
          <th style="width:15%">show</th>
          <th style="width:12%">line</th>
          <th style="width:12%">label</th>
          <th style="width:61%">caption</th>
        </tr>
      </thead>
      <tbody id="t_steps_body">
        <tr><td><input type="number" value="3" min="1" max="12"></td><td><input type="text" placeholder=""></td><td><input type="text" placeholder=""></td><td><input type="text" placeholder="a₁, a₂, a₃ 을 순서대로 찍어요."></td></tr>
        <tr><td><input type="number" value="12" min="1" max="12"></td><td><input type="text" placeholder=""></td><td><input type="text" placeholder=""></td><td><input type="text" placeholder="n이 커질수록 점들이 한 값으로 몰려가요."></td></tr>
        <tr><td><input type="number" value="12" min="1" max="12"></td><td><input type="text" placeholder="v"></td><td><input type="text" placeholder=""></td><td><input type="text" placeholder="다가가는 값을 점선으로 표시해요."></td></tr>
        <tr><td><input type="number" value="12" min="1" max="12"></td><td><input type="text" placeholder="v"></td><td><input type="text" placeholder="v"></td><td><input type="text" placeholder="a_n은 L에 한없이 가까워져요."></td></tr>
      </tbody>
    </table>
    <div class="button-group" style="margin-top:0">
      <button class="btn-secondary" onclick="addStep()">스텝 추가</button>
    </div>
  </div>

  <div class="button-group">
    <button class="btn-primary" onclick="saveTip()" id="t_save_btn">저장하고 배포</button>
    <button class="btn-secondary" onclick="previewTip()">md 미리보기</button>
  </div>
  <div class="status" id="t_status"></div>
</div>

<!-- 생성된 md 표시 (미리보기 / 저장 실패시 수동 복사용) -->
<div id="output" class="output-section">
  <h3 id="output_title">생성된 마크다운</h3>
  <div class="output-text" id="output_text"></div>
  <div class="button-group" style="margin-top:12px;">
    <button class="btn-copy" onclick="copyToClipboard()">📋 복사</button>
    <button class="btn-secondary" onclick="closeOutput()">닫기</button>
  </div>
  <div class="note" id="output_note"></div>
</div>

</div>

<script>
var FN = './.netlify/functions/save-content';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

// ---------- 목록 불러오기 ----------
async function loadFileList(type, selectId) {
  var sel = document.getElementById(selectId);
  try {
    var res = await fetch(FN + '?type=' + type);
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '목록 조회 실패');
    sel.innerHTML = '<option value="">불러올 파일 선택...</option>' +
      data.files.map(f => '<option value="' + f + '">' + f + '</option>').join('');
  } catch (e) {
    sel.innerHTML = '<option value="">(목록 조회 실패 - 새로 작성만 가능)</option>';
  }
}
loadFileList('concept', 'c_load_select');
loadFileList('tip', 't_load_select');

// ---------- 개념: 불러오기 / 새로작성 ----------
function newConcept() {
  ['c_filename','c_no','c_title','c_unit','c_sec','c_body'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('c_order').value = 1;
  document.getElementById('c_load_select').value = '';
  setStatus('c_status', '', '');
}

async function loadConcept() {
  var filename = document.getElementById('c_load_select').value;
  if (!filename) { alert('불러올 파일을 선택하세요.'); return; }
  setStatus('c_status', '불러오는 중...', 'pending');
  try {
    var res = await fetch(FN + '?type=concept&filename=' + encodeURIComponent(filename));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    var parsed = parseConceptMD(data.content);
    document.getElementById('c_filename').value = filename;
    document.getElementById('c_no').value = parsed.meta.no || '';
    document.getElementById('c_title').value = parsed.meta.title || '';
    document.getElementById('c_unit').value = parsed.meta.unit || '';
    document.getElementById('c_sec').value = parsed.meta.sec || '';
    document.getElementById('c_order').value = parsed.meta.order || 1;
    document.getElementById('c_body').value = parsed.body;
    setStatus('c_status', filename + ' 불러왔습니다. 수정 후 저장하세요.', 'ok');
  } catch (e) {
    setStatus('c_status', '불러오기 실패: ' + e.message, 'err');
  }
}

function parseConceptMD(text) {
  var m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: text };
  var meta = {};
  m[1].split('\n').forEach(function(line) {
    var idx = line.indexOf(':');
    if (idx < 0) return;
    meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
  });
  return { meta: meta, body: m[2].replace(/^\n+/, '').replace(/\n+$/, '') };
}

function buildConceptMD() {
  var no = document.getElementById('c_no').value || '개념 01';
  var title = document.getElementById('c_title').value;
  var unit = document.getElementById('c_unit').value || 'I. 단원';
  var sec = document.getElementById('c_sec').value || '01 섹션';
  var order = document.getElementById('c_order').value || 1;
  var body = document.getElementById('c_body').value;
  if (!title || !body) return null;
  return '---\nno: ' + no + '\ntitle: ' + title + '\nunit: ' + unit + '\nsec: ' + sec + '\norder: ' + order + '\n---\n\n' + body;
}

function previewConcept() {
  var md = buildConceptMD();
  if (!md) { alert('제목과 본문은 필수입니다.'); return; }
  showOutput('생성된 마크다운 (미리보기)', md, '');
}

async function saveConcept() {
  var md = buildConceptMD();
  if (!md) { alert('제목과 본문은 필수입니다.'); return; }
  var filename = document.getElementById('c_filename').value.trim();
  if (!/^[a-z][a-z0-9_]*\.md$/.test(filename)) { alert('파일명은 영문 소문자로 시작하고 .md로 끝나야 합니다 (예: c02.md)'); return; }
  await doSave('concept', filename, md, 'c_status', 'c_save_btn', 'c_load_select');
}

// ---------- 팁개념: 불러오기 / 새로작성 ----------
function newTip() {
  ['t_id','t_title','t_icon','t_oneline','t_related','t_curve','t_lines','t_label'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('t_label_at').value = 'right';
  document.getElementById('t_load_select').value = '';
  var tbody = document.getElementById('t_steps_body');
  tbody.innerHTML = '<tr><td><input type="number" value="12" min="1" max="12"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>';
  setStatus('t_status', '', '');
}

async function loadTip() {
  var filename = document.getElementById('t_load_select').value;
  if (!filename) { alert('불러올 파일을 선택하세요.'); return; }
  setStatus('t_status', '불러오는 중...', 'pending');
  try {
    var res = await fetch(FN + '?type=tip&filename=' + encodeURIComponent(filename));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    var parsed = parseTipMD(data.content);
    document.getElementById('t_id').value = filename.replace(/\.md$/, '');
    document.getElementById('t_title').value = parsed.meta.title || '';
    document.getElementById('t_icon').value = (parsed.meta.icon || '').replace(/^&#(\d+);$/, function(_, d){ return String.fromCharCode(+d); });
    document.getElementById('t_oneline').value = parsed.meta.oneline || '';
    document.getElementById('t_related').value = parsed.related.join(', ');
    document.getElementById('t_curve').value = parsed.graph.curve || '';
    document.getElementById('t_lines').value = parsed.graph.lines.join(', ');
    document.getElementById('t_label').value = parsed.graph.label || '';
    document.getElementById('t_label_at').value = parsed.graph.label_at || 'right';

    var tbody = document.getElementById('t_steps_body');
    tbody.innerHTML = '';
    parsed.steps.forEach(function(s) {
      var row = document.createElement('tr');
      row.innerHTML = '<td><input type="number" value="' + s.show + '" min="1" max="12"></td>' +
        '<td><input type="text" value="' + (s.line || '') + '"></td>' +
        '<td><input type="text" value="' + (s.label || '') + '"></td>' +
        '<td><input type="text" value="' + (s.caption || '').replace(/"/g,'&quot;') + '"></td>';
      tbody.appendChild(row);
    });
    setStatus('t_status', filename + ' 불러왔습니다. 수정 후 저장하세요.', 'ok');
  } catch (e) {
    setStatus('t_status', '불러오기 실패: ' + e.message, 'err');
  }
}

function parseTipMD(text) {
  var m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  var meta = {}, related = [];
  var rest = text;
  if (m) {
    m[1].split('\n').forEach(function(line) {
      var idx = line.indexOf(':');
      if (idx < 0) return;
      var k = line.slice(0, idx).trim(), v = line.slice(idx + 1).trim();
      if (k === 'related') {
        var mm = v.match(/^\[(.*)\]$/);
        related = mm ? mm[1].split(',').map(s => s.trim()).filter(Boolean) : [];
      } else {
        meta[k] = v;
      }
    });
    rest = m[2];
  }
  var graph = { curve: '', lines: [], label: '', label_at: 'right' };
  var gm = rest.match(/## graph\n([\s\S]*?)(?=\n## |$)/);
  if (gm) {
    gm[1].split('\n').forEach(function(line) {
      var idx = line.indexOf(':');
      if (idx < 0) return;
      var k = line.slice(0, idx).trim(), v = line.slice(idx + 1).trim();
      if (k === 'lines') {
        var mm = v.match(/^\[(.*)\]$/);
        graph.lines = mm ? mm[1].split(',').map(s => s.trim()).filter(Boolean) : [];
      } else if (k === 'curve' || k === 'label' || k === 'label_at') {
        graph[k] = v;
      }
    });
  }
  var steps = [];
  var sm = rest.match(/## steps\n\n([\s\S]*)$/);
  if (sm) {
    var lines = sm[1].trim().split('\n').filter(function(l){ return l.trim().startsWith('|'); });
    lines.slice(2).forEach(function(line) { // 헤더 2줄(제목행, 구분행) 스킵
      var cells = line.split('|').map(s => s.trim()).filter((_, i, arr) => i > 0 && i < arr.length - 1);
      if (cells.length < 4) return;
      steps.push({ show: cells[0], line: cells[1], label: cells[2], caption: cells[3] });
    });
  }
  return { meta: meta, related: related, graph: graph, steps: steps };
}

function buildTipMD() {
  var id = document.getElementById('t_id').value;
  var title = document.getElementById('t_title').value;
  var icon = document.getElementById('t_icon').value;
  var oneline = document.getElementById('t_oneline').value;
  var related = document.getElementById('t_related').value;
  var curve = document.getElementById('t_curve').value;
  var lines = document.getElementById('t_lines').value;
  var label = document.getElementById('t_label').value;
  var label_at = document.getElementById('t_label_at').value;
  if (!id || !title) return null;

  var relatedArray = related ? '[' + related.split(',').map(s => s.trim()).join(', ') + ']' : '[]';
  var linesArray = lines ? '[' + lines.split(',').map(s => s.trim()).join(', ') + ']' : '[]';

  var md = '---\ntitle: ' + title + '\nicon: ' + icon + '\noneline: ' + oneline + '\nrelated: ' + relatedArray + '\n---\n\n## graph\n\ncurve: ' + curve + '\nlines: ' + linesArray;
  if (label) md += '\nlabel: ' + label + '\nlabel_at: ' + label_at;
  md += '\n\n## steps\n\n| show | line | label | caption |\n|------|------|-------|---------|';

  var rows = document.querySelectorAll('#t_steps_body tr');
  rows.forEach(function(row) {
    var inputs = row.querySelectorAll('input');
    md += '\n| ' + inputs[0].value + ' | ' + inputs[1].value + ' | ' + inputs[2].value + ' | ' + inputs[3].value + ' |';
  });
  return { id: id, md: md };
}

function addStep() {
  var tbody = document.getElementById('t_steps_body');
  var row = document.createElement('tr');
  row.innerHTML = '<td><input type="number" value="12" min="1" max="12"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td>';
  tbody.appendChild(row);
}

function previewTip() {
  var r = buildTipMD();
  if (!r) { alert('ID와 제목은 필수입니다.'); return; }
  showOutput('생성된 마크다운 (미리보기)', r.md, '');
}

async function saveTip() {
  var r = buildTipMD();
  if (!r) { alert('ID와 제목은 필수입니다.'); return; }
  await doSave('tip', r.id + '.md', r.md, 't_status', 't_save_btn', 't_load_select');
}

// ---------- 공통 저장 로직 ----------
async function doSave(type, filename, content, statusId, btnId, selectId) {
  var btn = document.getElementById(btnId);
  btn.disabled = true;
  setStatus(statusId, '저장 중... GitHub에 commit하고 있습니다.', 'pending');
  try {
    var res = await fetch(FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: type, filename: filename, content: content }),
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '저장 실패');
    setStatus(statusId, '✅ ' + (data.message || '저장 완료') + (data.htmlUrl ? '\n' + data.htmlUrl : ''), 'ok');
    loadFileList(type, selectId);
  } catch (e) {
    setStatus(statusId, '❌ 자동 저장 실패: ' + e.message + '\n\nGITHUB_TOKEN이 아직 설정되지 않았을 수 있습니다. 아래 "복사" 버튼으로 GitHub에 수동으로 붙여넣으세요.', 'err');
    showOutput('저장 실패 - 수동 복사용', content, 'mathuit/content/' + (type === 'concept' ? 'concept' : 'tip') + '/' + filename + ' 경로에 GitHub에서 직접 저장하세요.');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(id, text, cls) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status' + (cls ? ' show ' + cls : '');
}

function showOutput(title, text, note) {
  document.getElementById('output_title').textContent = title;
  document.getElementById('output_text').textContent = text;
  document.getElementById('output_note').textContent = note;
  document.getElementById('output').classList.add('active');
  document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeOutput() {
  document.getElementById('output').classList.remove('active');
}

function copyToClipboard() {
  var text = document.getElementById('output_text').textContent;
  navigator.clipboard.writeText(text).then(function() {
    alert('복사되었습니다! GitHub에 붙여넣으세요.');
  });
}
</script>
