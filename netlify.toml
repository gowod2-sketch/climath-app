# Netlify 프로젝트 math-tip-popup (https://math-tip-popup.netlify.app) 설정
#
# 이 저장소에는 두 프로젝트가 함께 있습니다.
#   /          climath-oap (React + Vite + Capacitor + Supabase)
#   /mathuit   Mathuit - 수열의 극한 PWA  <- 이 사이트가 배포하는 대상
#
# base를 mathuit으로 두면 Netlify가 그 폴더를 프로젝트 루트로 취급합니다.
# 루트의 package.json을 보지 않으므로 불필요한 npm install이 돌지 않습니다.

[build]
  base = "mathuit"

  # build.py가 content/*.md 문법을 검사합니다.
  # 검사에 실패하면 빌드가 여기서 멈추고 배포되지 않습니다 -
  # 깨진 앱이 라이브로 나가는 것을 막는 안전장치입니다.
  command = "python3 build.py && mkdir -p dist && cp index.html sw.js manifest.webmanifest icon.png _headers dist/"

  # base 기준 상대경로이므로 실제로는 mathuit/dist 입니다.
  publish = "dist"

# 서비스워커는 절대 캐시되면 안 됩니다.
# 캐시되면 새 배포가 사용자에게 영영 도달하지 않습니다.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
